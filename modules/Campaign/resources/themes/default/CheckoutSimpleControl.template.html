<div class="bjs-checkout-control bjs-control-stack">
    <!-- UI Settings -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">UI Settings</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Preview Label</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.ui.previewLabel %>"
                   data-path="ui.previewLabel">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Mode Label</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.ui.modeLabel %>"
                   data-path="ui.modeLabel">
        </label>
    </section>

    <!-- Header -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Header</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Header Title</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headerTitle %>"
                   data-path="headerTitle">
        </label>
    </section>

    <!-- Button Texts -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Button Texts</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Submit Button Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.buttonTexts.submit %>"
                   data-path="buttonTexts.submit">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Submitting Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.buttonTexts.submitting %>"
                   data-path="buttonTexts.submitting">
        </label>
    </section>

    <!-- Section Headlines -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Section Headlines</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Contact Information Headline</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headlines.contact %>"
                   data-path="headlines.contact">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Privacy Notice</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headlines.privacy %>"
                   data-path="headlines.privacy">
        </label>
    </section>

    <!-- Contact Input Labels -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Contact Input Labels</div>

        <div class="bjs-checkout-grid-2">
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">First Name</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.firstName %>"
                       data-path="contactLabels.firstName">
            </label>
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">Last Name</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.lastName %>"
                       data-path="contactLabels.lastName">
            </label>
        </div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Email</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.email %>"
                   data-path="contactLabels.email">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Phone Number</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.phone %>"
                   data-path="contactLabels.phone">
        </label>
    </section>
</div>
