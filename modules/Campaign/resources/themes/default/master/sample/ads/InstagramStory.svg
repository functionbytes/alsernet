<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Instagram Story ad preview">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Phone silhouette (9:16 inside 9:10 frame — centered) -->
  <g transform="translate(60 16)">
    <rect x="0" y="0" width="60" height="168" rx="8"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke-bold)" stroke-width="1.4"/>
    <rect x="22" y="3" width="16" height="2.4" rx="1.2" fill="var(--illust-stroke-bold)"/>

    <!-- Screen area -->
    <rect x="3" y="9" width="54" height="150" rx="4"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke)" stroke-width=".5"/>

    <!-- Story progress bars -->
    <rect x="6"  y="13" width="10" height="1.2" rx=".6" fill="var(--illust-stroke-bold)"/>
    <rect x="18" y="13" width="10" height="1.2" rx=".6" fill="var(--illust-stroke)" opacity=".5"/>
    <rect x="30" y="13" width="10" height="1.2" rx=".6" fill="var(--illust-stroke)" opacity=".35"/>
    <rect x="42" y="13" width="12" height="1.2" rx=".6" fill="var(--illust-stroke)" opacity=".35"/>

    <!-- Brand row -->
    <circle cx="9"  cy="20" r="2" fill="var(--illust-fill)" stroke="var(--illust-stroke-bold)" stroke-width=".6"/>
    <rect x="13.5" y="18.8" width="14" height="1.2" rx=".6" fill="var(--illust-stroke-bold)"/>
    <rect x="13.5" y="21" width="8"  height=".8" rx=".4" fill="var(--illust-stroke)" opacity=".6"/>

    <!-- Image area (subtle gray fill + mountain icon) -->
    <rect x="4" y="26" width="52" height="86" fill="var(--illust-fill)"/>
    <path d="M4 102 L16 88 L24 94 L34 82 L42 92 L52 86 L56 92 L56 112 L4 112 Z"
          fill="var(--illust-stroke)" opacity=".55"/>
    <circle cx="44" cy="42" r="3" fill="var(--color-card-bg)" stroke="var(--illust-stroke)" stroke-width=".5"/>

    <!-- Headline (2 lines) -->
    <rect x="6"  y="120" width="48" height="2"   rx="1" fill="var(--illust-stroke-bold)"/>
    <rect x="12" y="124" width="36" height="2"   rx="1" fill="var(--illust-stroke-bold)"/>

    <!-- Subline -->
    <rect x="13" y="129" width="34" height="1.2" rx=".6" fill="var(--illust-stroke)" opacity=".65"/>

    <!-- Pill CTA button (black, like email template buttons) -->
    <rect x="14" y="136" width="32" height="9" rx="4.5" fill="var(--illust-stroke-bold)"/>
    <rect x="22" y="139.5" width="16" height="2" rx="1" fill="var(--color-card-bg)"/>

    <!-- Swipe-up chevron -->
    <path d="M27 151 L30 149 L33 151" stroke="var(--illust-stroke)" stroke-width=".8"
          stroke-linecap="round" stroke-linejoin="round" fill="none" opacity=".7"/>
  </g>

  <!-- Aspect label -->
  <rect x="138" y="12" width="28" height="10" rx="5" fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)" stroke-width=".7"/>
  <text x="152" y="19" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="6" font-weight="700" fill="var(--illust-stroke-bold)" letter-spacing=".4">9:16</text>
</svg>
