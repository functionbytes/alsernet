<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Meta Carousel ad preview">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Outer post card -->
  <g transform="translate(14 18)">
    <rect x="0" y="0" width="152" height="164" rx="6"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke-bold)" stroke-width="1.2"/>

    <!-- Brand row -->
    <circle cx="14" cy="14" r="5" fill="var(--illust-fill)" stroke="var(--illust-stroke-bold)" stroke-width=".7"/>
    <rect x="22" y="10" width="50" height="2.4" rx="1.2" fill="var(--illust-stroke-bold)"/>
    <rect x="22" y="15" width="28" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".6"/>

    <!-- Headline copy -->
    <rect x="10" y="28" width="132" height="1.8" rx=".9" fill="var(--illust-stroke-bold)"/>
    <rect x="10" y="32" width="96"  height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".7"/>

    <!-- Carousel track: card1 (full), card2 (half), card3 (sliver) -->
    <!-- Card 1 -->
    <rect x="10" y="40" width="72" height="80" rx="3" fill="var(--illust-fill)"
          stroke="var(--illust-stroke)" stroke-width=".5"/>
    <path d="M10 100 L28 86 L40 94 L54 80 L68 92 L78 86 L82 92 L82 120 L10 120 Z"
          fill="var(--illust-stroke)" opacity=".55"/>
    <circle cx="68" cy="56" r="3" fill="var(--color-card-bg)" stroke="var(--illust-stroke)" stroke-width=".5"/>

    <!-- Card 1 body -->
    <rect x="10" y="124" width="56" height="1.8" rx=".9" fill="var(--illust-stroke-bold)"/>
    <rect x="10" y="128" width="40" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".65"/>

    <!-- Card 1 CTA pill -->
    <rect x="10" y="133" width="30" height="8" rx="1.5" fill="var(--illust-stroke-bold)"/>
    <rect x="14" y="136" width="22" height="2" rx="1" fill="var(--color-card-bg)"/>

    <!-- Card 2 (half shown) -->
    <rect x="88" y="40" width="54" height="80" rx="3" fill="var(--illust-fill)"
          stroke="var(--illust-stroke)" stroke-width=".5"/>
    <path d="M88 100 L102 88 L114 94 L124 82 L136 92 L142 88 L142 120 L88 120 Z"
          fill="var(--illust-stroke)" opacity=".4"/>
    <rect x="88" y="124" width="40" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".7"/>
    <rect x="88" y="128" width="28" height="1.2" rx=".6" fill="var(--illust-stroke)" opacity=".5"/>

    <!-- Right chevron indicator -->
    <path d="M146 78 L151 84 L146 90" stroke="var(--illust-stroke-bold)" stroke-width="1.2"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="148" cy="84" r="6" fill="var(--color-card-bg)" stroke="var(--illust-stroke-bold)" stroke-width=".8"/>
    <path d="M146 82 L150 84 L146 86" stroke="var(--illust-stroke-bold)" stroke-width="1"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Carousel dots indicator -->
    <circle cx="70" cy="154" r="1.3" fill="var(--illust-stroke-bold)"/>
    <circle cx="76" cy="154" r="1"   fill="var(--illust-stroke)" opacity=".55"/>
    <circle cx="82" cy="154" r="1"   fill="var(--illust-stroke)" opacity=".55"/>
  </g>

  <!-- Aspect label -->
  <rect x="144" y="188" width="22" height="10" rx="5" fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)" stroke-width=".7"/>
  <text x="155" y="195" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="6" font-weight="700" fill="var(--illust-stroke-bold)" letter-spacing=".4">1:1</text>
</svg>
