<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Blank ad canvas">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Dashed canvas frame -->
  <rect x="24" y="20" width="132" height="160" rx="4"
        fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)"
        stroke-width="1.2"
        stroke-dasharray="3 3"/>

  <!-- Corner accents -->
  <g fill="var(--illust-stroke-bold)">
    <rect x="22" y="18" width="4" height="4"/>
    <rect x="154" y="18" width="4" height="4"/>
    <rect x="22" y="178" width="4" height="4"/>
    <rect x="154" y="178" width="4" height="4"/>
  </g>

  <!-- Plus icon centered -->
  <circle cx="90" cy="92" r="20" fill="var(--illust-bg)" stroke="var(--illust-stroke-bold)" stroke-width="1.2"/>
  <line x1="90" y1="82" x2="90" y2="102" stroke="var(--illust-stroke-bold)" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="80" y1="92" x2="100" y2="92" stroke="var(--illust-stroke-bold)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Label bars -->
  <rect x="58" y="126" width="64" height="2.4" rx="1.2" fill="var(--illust-stroke-bold)"/>
  <rect x="68" y="132" width="44" height="1.8" rx=".9" fill="var(--illust-stroke)" opacity=".65"/>

  <!-- Ruler hints (design canvas vibe) -->
  <g stroke="var(--illust-stroke)" stroke-width=".5" opacity=".4">
    <line x1="60" y1="150" x2="68" y2="150"/>
    <line x1="72" y1="150" x2="80" y2="150"/>
    <line x1="84" y1="150" x2="92" y2="150"/>
    <line x1="96" y1="150" x2="104" y2="150"/>
    <line x1="108" y1="150" x2="116" y2="150"/>
    <line x1="120" y1="150" x2="128" y2="150"/>
  </g>
</svg>
