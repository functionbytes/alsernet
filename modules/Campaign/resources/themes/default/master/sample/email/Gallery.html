        p, h1, h2, h3, h4, h5, h6, label, ul {

        a {
            color: inherit;
        }
        [builder-element="PageElement"] {
            min-height: 100vh;
            display: block;
            flex-direction: ;
            justify-content: ;
            align-items: ;
        }

        [builder-element="PageElement"] > [builder-element="BlockElement"] {
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        [builder-element="PageElement"] > [builder-element="BlockElement"]:not(:last-child) {
            margin-bottom: 0px;
        }

        

        
        @media (min-width: 800px) {
            [builder-element="PageElement"] > [builder-element="BlockElement"] {
                max-width: 800px;
            }
        }
        

        
        /* default_block_background_color targets the INNER styled div (`> :first-child`),
           NOT the outer `<div builder-element="BlockElement">` wrapper. The outer is a
           hover/selection anchor with no painting role; the inner is where the formatter
           writes per-block bg + border + radius + padding. Painting the default bg on
           the outer (legacy behavior, retired 2026-05-05) caused outer's flat-edge
           rectangle to visually mask any per-block `border_radius`. Targeting the inner
           lets default bg compose with per-block radius — they paint the same div,
           formatter's `!important` inline style still wins when set. */
        [builder-element="PageElement"] > [builder-element="BlockElement"] > :first-child {
            background-color: #FFFFFF;
        }
        

        [builder-element="PageElement"] > [builder-element="BlockElement"] > :first-child {
            padding-top: 20px;
            padding-right: 20px;
            padding-bottom: 20px;
            padding-left: 20px;
        }
    </style>
</head>
