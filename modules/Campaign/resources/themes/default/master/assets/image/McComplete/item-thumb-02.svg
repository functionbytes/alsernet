<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Folded linen tea-towel stack with stitched edge, editorial line drawing">
  <rect width="400" height="400" fill="#F7F5F0"/>

  <!-- ambient floor shadow -->
  <ellipse cx="200" cy="332" rx="128" ry="7" fill="#C9C2B2" opacity="0.55"/>

  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">

    <!-- bottom folded towel (widest, darkest fill) -->
    <g>
      <rect x="90" y="258" width="220" height="60" fill="#C9C2B2" stroke="#1C1917" stroke-width="2" rx="3"/>
      <!-- fold crease along the back -->
      <line x1="90" y1="268" x2="310" y2="268" stroke="#1C1917" stroke-width="0.9"/>
      <!-- weave texture (3 horizontal lines) -->
      <line x1="100" y1="282" x2="300" y2="282" stroke="#FEFDFA" stroke-width="0.7" opacity="0.8"/>
      <line x1="100" y1="294" x2="300" y2="294" stroke="#FEFDFA" stroke-width="0.7" opacity="0.8"/>
      <line x1="100" y1="306" x2="300" y2="306" stroke="#FEFDFA" stroke-width="0.7" opacity="0.8"/>
      <!-- stitched edge (dashed) along front bottom -->
      <line x1="102" y1="314" x2="308" y2="314" stroke="#1C1917" stroke-width="0.9" stroke-dasharray="4 4"/>
    </g>

    <!-- middle folded towel (narrower, vessel white) -->
    <g>
      <rect x="110" y="202" width="180" height="58" fill="#FEFDFA" stroke="#1C1917" stroke-width="2" rx="3"/>
      <line x1="110" y1="212" x2="290" y2="212" stroke="#C9C2B2" stroke-width="0.9"/>
      <!-- weave crosshatch -->
      <line x1="120" y1="224" x2="280" y2="224" stroke="#C9C2B2" stroke-width="0.7"/>
      <line x1="120" y1="234" x2="280" y2="234" stroke="#C9C2B2" stroke-width="0.7"/>
      <line x1="120" y1="244" x2="280" y2="244" stroke="#C9C2B2" stroke-width="0.7"/>
      <!-- stitched edge -->
      <line x1="122" y1="254" x2="278" y2="254" stroke="#1C1917" stroke-width="0.8" stroke-dasharray="4 4"/>
      <!-- small woven label square, left -->
      <rect x="128" y="228" width="14" height="10" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.8"/>
    </g>

    <!-- top folded towel (narrowest, vessel white w/ stone stripe band) -->
    <g>
      <rect x="130" y="148" width="140" height="56" fill="#FEFDFA" stroke="#1C1917" stroke-width="2" rx="3"/>
      <line x1="130" y1="158" x2="270" y2="158" stroke="#C9C2B2" stroke-width="0.9"/>
      <!-- signature horizontal stripe pattern -->
      <rect x="144" y="170" width="112" height="4" fill="#C9C2B2" stroke="none"/>
      <rect x="144" y="178" width="112" height="2" fill="#C9C2B2" stroke="none"/>
      <rect x="144" y="184" width="112" height="4" fill="#C9C2B2" stroke="none"/>
      <!-- stitched edge -->
      <line x1="142" y1="198" x2="258" y2="198" stroke="#1C1917" stroke-width="0.8" stroke-dasharray="4 4"/>
    </g>

    <!-- sprig of dried herb laid diagonally across the stack (editorial prop) -->
    <path d="M 244 110 C 262 120, 274 136, 276 156" stroke="#1C1917" stroke-width="1.2" fill="none"/>
    <!-- leaves along the sprig -->
    <ellipse cx="252" cy="118" rx="4" ry="2" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.8" transform="rotate(-30 252 118)"/>
    <ellipse cx="262" cy="130" rx="4.2" ry="2.2" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.8" transform="rotate(-20 262 130)"/>
    <ellipse cx="270" cy="142" rx="3.8" ry="2" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.8" transform="rotate(-10 270 142)"/>

    <!-- floor line -->
    <line x1="56" y1="340" x2="344" y2="340" stroke="#C9C2B2" stroke-width="1"/>
  </g>
</svg>
