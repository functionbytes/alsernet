<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Wrapped parcel with twine cross, handwritten tag, and dried sprig — editorial thank-you illustration">
  <rect width="400" height="400" fill="#F7F5F0"/>

  <!-- ambient floor shadow -->
  <ellipse cx="200" cy="332" rx="148" ry="9" fill="#C9C2B2" opacity="0.55"/>

  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">

    <!-- parcel box: kraft-paper rectangle with subtle perspective -->
    <!-- back face shadow (creating slight depth) -->
    <path d="M 92 154 L 308 154 L 320 168 L 320 320 L 80 320 L 80 168 Z"
          fill="#C9C2B2" stroke="#1C1917" stroke-width="1.6" opacity="0.7"/>
    <!-- front face (kraft-paper, vessel-white-ish) -->
    <rect x="80" y="168" width="240" height="152" fill="#FEFDFA" stroke="#1C1917" stroke-width="2"/>

    <!-- top crease line (showing fold of paper) -->
    <line x1="80" y1="168" x2="320" y2="168" stroke="#1C1917" stroke-width="1.2"/>
    <line x1="92" y1="154" x2="308" y2="154" stroke="#C9C2B2" stroke-width="1"/>

    <!-- paper texture: 3 subtle horizontal grain lines -->
    <line x1="100" y1="200" x2="300" y2="200" stroke="#C9C2B2" stroke-width="0.6" opacity="0.6"/>
    <line x1="100" y1="244" x2="300" y2="244" stroke="#C9C2B2" stroke-width="0.6" opacity="0.5"/>
    <line x1="100" y1="288" x2="300" y2="288" stroke="#C9C2B2" stroke-width="0.6" opacity="0.5"/>

    <!-- twine: vertical strip across box -->
    <rect x="186" y="154" width="28" height="166" fill="#1C1917" stroke="none" opacity="0.92"/>
    <!-- twine: horizontal strip across box -->
    <rect x="80" y="232" width="240" height="14" fill="#1C1917" stroke="none" opacity="0.92"/>
    <!-- twine knot/bow center: small loop crossings -->
    <circle cx="200" cy="239" r="11" fill="#1C1917" stroke="none"/>
    <!-- bow loops (left + right) -->
    <path d="M 200 239 C 178 222, 158 224, 156 234 C 158 244, 178 246, 200 239 Z"
          fill="#FEFDFA" stroke="#1C1917" stroke-width="1.6"/>
    <path d="M 200 239 C 222 222, 242 224, 244 234 C 242 244, 222 246, 200 239 Z"
          fill="#FEFDFA" stroke="#1C1917" stroke-width="1.6"/>
    <!-- bow tail strands hanging down -->
    <path d="M 192 250 C 188 264, 186 278, 184 290" stroke-width="1.6"/>
    <path d="M 208 250 C 212 264, 214 278, 216 290" stroke-width="1.6"/>

    <!-- tag: small parchment hanging from twine on top-left -->
    <g transform="rotate(-12 162 142)">
      <path d="M 144 124 L 180 124 L 188 132 L 180 158 L 144 158 Z"
            fill="#FEFDFA" stroke="#1C1917" stroke-width="1.6"/>
      <!-- tag punch hole -->
      <circle cx="180" cy="132" r="2.4" fill="none" stroke="#1C1917" stroke-width="1"/>
      <!-- handwritten 'thank you' lines on tag -->
      <line x1="150" y1="138" x2="178" y2="138" stroke="#1C1917" stroke-width="0.9"/>
      <line x1="150" y1="146" x2="172" y2="146" stroke="#1C1917" stroke-width="0.9"/>
      <line x1="150" y1="152" x2="174" y2="152" stroke="#C9C2B2" stroke-width="0.7"/>
    </g>
    <!-- thread connecting tag to twine knot area -->
    <path d="M 184 130 C 192 134, 198 138, 200 144" stroke="#1C1917" stroke-width="0.9"/>

    <!-- dried sprig on top of parcel (right side) -->
    <path d="M 232 166 C 252 152, 270 144, 290 138" stroke="#1C1917" stroke-width="1.4"/>
    <!-- leaves along sprig -->
    <ellipse cx="248" cy="158" rx="5.5" ry="2.6" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.9" transform="rotate(-30 248 158)"/>
    <ellipse cx="262" cy="150" rx="5" ry="2.4" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.9" transform="rotate(-25 262 150)"/>
    <ellipse cx="276" cy="144" rx="4.6" ry="2.2" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.9" transform="rotate(-20 276 144)"/>
    <ellipse cx="288" cy="140" rx="4" ry="2" fill="#C9C2B2" stroke="#1C1917" stroke-width="0.8" transform="rotate(-15 288 140)"/>
    <!-- tiny berry cluster -->
    <circle cx="240" cy="166" r="1.8" fill="#1C1917" stroke="none"/>
    <circle cx="244" cy="170" r="1.6" fill="#1C1917" stroke="none"/>
    <circle cx="236" cy="170" r="1.4" fill="#1C1917" stroke="none"/>

    <!-- subtle confetti / sparkle dots scattered above box -->
    <circle cx="60"  cy="120" r="1.6" fill="#C9C2B2" stroke="none"/>
    <circle cx="78"  cy="92"  r="1.4" fill="#C9C2B2" stroke="none"/>
    <circle cx="110" cy="76"  r="1.3" fill="#C9C2B2" stroke="none"/>
    <circle cx="332" cy="102" r="1.6" fill="#C9C2B2" stroke="none"/>
    <circle cx="312" cy="80"  r="1.3" fill="#C9C2B2" stroke="none"/>
    <circle cx="354" cy="138" r="1.2" fill="#C9C2B2" stroke="none"/>
    <!-- 4-point sparkles (small plus-shapes) -->
    <g stroke="#1C1917" stroke-width="1">
      <line x1="48"  y1="156" x2="48"  y2="166"/>
      <line x1="44"  y1="161" x2="52"  y2="161"/>
      <line x1="346" y1="170" x2="346" y2="180"/>
      <line x1="342" y1="175" x2="350" y2="175"/>
      <line x1="92"  y1="56"  x2="92"  y2="64"/>
      <line x1="88"  y1="60"  x2="96"  y2="60"/>
    </g>

    <!-- floor line -->
    <line x1="32" y1="338" x2="368" y2="338" stroke="#C9C2B2" stroke-width="1"/>
  </g>
</svg>
