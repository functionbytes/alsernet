<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="AI editor preview with image generation and live collaboration comments">
  <defs>
    <linearGradient id="aiPanelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F8FB"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="popupShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Editor window card -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="30" width="660" height="420" rx="14" fill="#FFFFFF"/>
    <!-- Editor toolbar -->
    <rect x="60" y="30" width="660" height="44" rx="14" fill="#F8F9FA"/>
    <rect x="60" y="60" width="660" height="14" fill="#F8F9FA"/>
    <!-- File-type tab indicator (muted slate) -->
    <rect x="76" y="44" width="20" height="22" rx="3" fill="#9CA3AF"/>
    <!-- Toolbar control pills -->
    <rect x="380" y="44" width="50" height="22" rx="11" fill="#E5E7EB"/>
    <rect x="436" y="44" width="22" height="22" rx="11" fill="#E5E7EB"/>
    <rect x="464" y="44" width="22" height="22" rx="11" fill="#E5E7EB"/>
    <!-- Avatar cluster — cool gray with one brand-blue accent -->
    <circle cx="500" cy="55" r="10" fill="#9CA3AF"/>
    <circle cx="514" cy="55" r="10" fill="#B0B6BF"/>
    <circle cx="528" cy="55" r="10" fill="#C5C9CE"/>
    <rect x="540" y="46" width="32" height="18" rx="9" fill="#1A73E8"/>
    <text x="556" y="59" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">+4</text>
    <!-- Comment + cam icons -->
    <rect x="582" y="46" width="22" height="18" rx="3" fill="#E5E7EB"/>
    <rect x="610" y="46" width="22" height="18" rx="3" fill="#E5E7EB"/>
    <!-- Slideshow button + share avatar -->
    <rect x="638" y="44" width="60" height="22" rx="11" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
    <text x="668" y="59" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#5F6368">Slideshow</text>
    <circle cx="710" cy="55" r="9" fill="#9CA3AF"/>

    <!-- Sub-toolbar (icons row) -->
    <rect x="80" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="100" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="120" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="140" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="160" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="180" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="200" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="220" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>
    <rect x="244" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>

    <rect x="280" y="84" width="60" height="18" rx="3" fill="#FFFFFF" stroke="#DADCE0"/>
    <text x="295" y="97" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="500" fill="#6B7280">Background</text>
    <rect x="346" y="84" width="40" height="18" rx="3" fill="#FFFFFF" stroke="#DADCE0"/>
    <text x="356" y="97" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="500" fill="#6B7280">Layout</text>
    <rect x="392" y="84" width="36" height="18" rx="3" fill="#FFFFFF" stroke="#DADCE0"/>
    <text x="400" y="97" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="500" fill="#6B7280">Theme</text>
    <rect x="438" y="86" width="14" height="14" rx="2" fill="#E5E7EB"/>

    <line x1="60" y1="110" x2="720" y2="110" stroke="#E5E7EB" stroke-width="1"/>

    <!-- Left thumbnail strip -->
    <g>
      <text x="80" y="130" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#6B7280">1</text>
      <rect x="92" y="120" width="64" height="40" rx="4" fill="#F1F3F4" stroke="#E5E7EB"/>
      <rect x="98" y="128" width="36" height="3" rx="1.5" fill="#D1D5DB"/>
      <rect x="98" y="135" width="22" height="2" rx="1" fill="#D1D5DB"/>

      <text x="80" y="180" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#1A73E8">2</text>
      <rect x="92" y="170" width="64" height="40" rx="4" fill="#FFFFFF" stroke="#1A73E8" stroke-width="2"/>
      <rect x="98" y="178" width="20" height="3" rx="1.5" fill="#D1D5DB"/>
      <circle cx="135" cy="190" r="8" fill="#7BA86E"/>
      <line x1="98" y1="200" x2="148" y2="200" stroke="#D1D5DB" stroke-width="2" stroke-linecap="round"/>

      <text x="80" y="230" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#6B7280">3</text>
      <g transform="translate(92,220)">
        <rect width="64" height="40" rx="4" fill="#F1F3F4" stroke="#E5E7EB"/>
        <rect x="6" y="8" width="22" height="22" rx="2" fill="#D1D5DB"/>
        <rect x="32" y="8" width="22" height="2" rx="1" fill="#D1D5DB"/>
        <rect x="32" y="14" width="22" height="2" rx="1" fill="#D1D5DB"/>
      </g>

      <text x="80" y="280" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#6B7280">4</text>
      <g transform="translate(92,270)">
        <rect width="64" height="40" rx="4" fill="#F1F3F4" stroke="#E5E7EB"/>
        <!-- Bar chart — cool gray with one brand-blue accent -->
        <rect x="10" y="22" width="6" height="10" fill="#C5C9CE"/>
        <rect x="20" y="16" width="6" height="16" fill="#9CA3AF"/>
        <rect x="30" y="12" width="6" height="20" fill="#1A73E8"/>
        <rect x="40" y="20" width="6" height="12" fill="#9CA3AF"/>
      </g>
    </g>

    <!-- Main slide canvas -->
    <g>
      <rect x="180" y="120" width="510" height="280" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
      <!-- Live-user name tag (kept red — small accent for "active editor") -->
      <rect x="318" y="130" width="80" height="20" rx="3" fill="#D9534F"/>
      <text x="358" y="144" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Jeffrey Clark</text>
      <line x1="358" y1="150" x2="358" y2="178" stroke="#D9534F" stroke-width="1.5"/>

      <!-- Live cursor (red — small) -->
      <path d="M398 154 L398 168 L402 164 L405 170 L408 168 L405 162 L410 162 Z" fill="#D9534F"/>

      <!-- Text bars (left) -->
      <rect x="200" y="180" width="200" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="200" y="192" width="160" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="200" y="210" width="200" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="200" y="222" width="220" height="6" rx="3" fill="#E5E7EB"/>
      <rect x="200" y="234" width="120" height="6" rx="3" fill="#E5E7EB"/>

      <!-- Generated image: soccer ball on muted-green field (THE AI demo content — kept colorful by design) -->
      <g transform="translate(440,180)">
        <rect width="200" height="160" rx="8" fill="#7BA86E"/>
        <!-- horizon strip (deeper muted green) -->
        <rect y="100" width="200" height="60" fill="#5C8451"/>
        <!-- grass blades -->
        <line x1="20" y1="160" x2="20" y2="148" stroke="#6B9560" stroke-width="2"/>
        <line x1="40" y1="160" x2="40" y2="146" stroke="#6B9560" stroke-width="2"/>
        <line x1="60" y1="160" x2="60" y2="150" stroke="#6B9560" stroke-width="2"/>
        <line x1="80" y1="160" x2="80" y2="148" stroke="#6B9560" stroke-width="2"/>
        <line x1="100" y1="160" x2="100" y2="146" stroke="#6B9560" stroke-width="2"/>
        <line x1="120" y1="160" x2="120" y2="150" stroke="#6B9560" stroke-width="2"/>
        <line x1="140" y1="160" x2="140" y2="148" stroke="#6B9560" stroke-width="2"/>
        <line x1="160" y1="160" x2="160" y2="146" stroke="#6B9560" stroke-width="2"/>
        <line x1="180" y1="160" x2="180" y2="150" stroke="#6B9560" stroke-width="2"/>
        <!-- Goal posts in background -->
        <line x1="20" y1="100" x2="20" y2="60" stroke="#FFFFFF" stroke-width="3"/>
        <line x1="180" y1="100" x2="180" y2="60" stroke="#FFFFFF" stroke-width="3"/>
        <line x1="20" y1="60" x2="180" y2="60" stroke="#FFFFFF" stroke-width="3"/>
        <!-- goal net hint -->
        <g stroke="#FFFFFF" stroke-width="0.6" opacity="0.55">
          <line x1="40" y1="60" x2="40" y2="100"/>
          <line x1="60" y1="60" x2="60" y2="100"/>
          <line x1="80" y1="60" x2="80" y2="100"/>
          <line x1="100" y1="60" x2="100" y2="100"/>
          <line x1="120" y1="60" x2="120" y2="100"/>
          <line x1="140" y1="60" x2="140" y2="100"/>
          <line x1="160" y1="60" x2="160" y2="100"/>
          <line x1="20" y1="74" x2="180" y2="74"/>
          <line x1="20" y1="88" x2="180" y2="88"/>
        </g>
        <!-- Goalie hand silhouette -->
        <path d="M148 96 Q150 70 165 70 Q170 70 170 80 L170 100 Z" fill="#374151"/>
        <ellipse cx="158" cy="96" rx="14" ry="8" fill="#E8C49A"/>
        <!-- Soccer ball -->
        <circle cx="100" cy="120" r="22" fill="#FFFFFF" stroke="#374151" stroke-width="1"/>
        <polygon points="100,108 108,114 105,124 95,124 92,114" fill="#374151"/>
        <line x1="108" y1="114" x2="118" y2="112" stroke="#374151" stroke-width="1.2"/>
        <line x1="92" y1="114" x2="82" y2="112" stroke="#374151" stroke-width="1.2"/>
        <line x1="105" y1="124" x2="112" y2="135" stroke="#374151" stroke-width="1.2"/>
        <line x1="95" y1="124" x2="88" y2="135" stroke="#374151" stroke-width="1.2"/>
        <line x1="100" y1="108" x2="100" y2="100" stroke="#374151" stroke-width="1.2"/>
        <ellipse cx="100" cy="143" rx="20" ry="3" fill="#000000" opacity="0.18"/>
      </g>

      <!-- Bottom collaborator name tag (cool gray) -->
      <line x1="400" y1="380" x2="400" y2="362" stroke="#9CA3AF" stroke-width="1.5"/>
      <rect x="360" y="378" width="100" height="20" rx="3" fill="#6B7280"/>
      <text x="410" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Shirley Franklin</text>
    </g>

    <!-- Comment popup (bottom-left) -->
    <g filter="url(#popupShadow)" transform="translate(196,330)">
      <rect width="200" height="78" rx="10" fill="#FFFFFF"/>
      <!-- Avatar — cool gray (was yellow) -->
      <circle cx="22" cy="22" r="11" fill="#9CA3AF"/>
      <text x="22" y="26" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">S</text>
      <text x="42" y="20" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#202124">Shirley Franklin</text>
      <rect x="42" y="28" width="146" height="18" rx="4" fill="#F1F3F4"/>
      <text x="50" y="40" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6B7280">Great image! It helps tell a story</text>
      <!-- Action button stays brand blue -->
      <rect x="42" y="52" width="58" height="18" rx="4" fill="#1A73E8"/>
      <text x="71" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Comment</text>
      <rect x="106" y="52" width="48" height="18" rx="4" fill="#FFFFFF" stroke="#DADCE0"/>
      <text x="130" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#6B7280">Cancel</text>
    </g>

    <!-- AI panel popup (top-right) -->
    <g filter="url(#popupShadow)" transform="translate(530,150)">
      <rect width="200" height="120" rx="10" fill="url(#aiPanelGrad)"/>
      <!-- Sparkle icon — brand blue + muted gray secondary spark -->
      <g transform="translate(14,14)">
        <path d="M8 0 L9.5 6.5 L16 8 L9.5 9.5 L8 16 L6.5 9.5 L0 8 L6.5 6.5 Z" fill="#1A73E8"/>
        <path d="M16 12 L17 15 L20 16 L17 17 L16 20 L15 17 L12 16 L15 15 Z" fill="#9CA3AF"/>
      </g>
      <text x="42" y="26" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#202124">Generate an image</text>
      <!-- Bullet dot — cool gray (was red) -->
      <circle cx="22" cy="50" r="9" fill="#9CA3AF"/>
      <text x="40" y="48" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6B7280">Create an image of a soccer ball</text>
      <text x="40" y="60" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6B7280">in front of a goal with goalie's</text>
      <text x="40" y="72" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#6B7280">outstretched hand</text>
      <line x1="14" y1="84" x2="186" y2="84" stroke="#E5E7EB"/>
      <!-- Sparkle row -->
      <path d="M22 100 L24 96 L26 100 L30 102 L26 104 L24 108 L22 104 L18 102 Z" fill="#1A73E8" opacity="0.55"/>
      <rect x="36" y="98" width="120" height="3" rx="1.5" fill="#E0E7FF"/>
      <rect x="36" y="105" width="80" height="3" rx="1.5" fill="#E0E7FF"/>
    </g>
  </g>

  <!-- Speech bubble flag for AI popup (top-right) — cool gray (was purple) -->
  <g transform="translate(688,265)">
    <rect width="56" height="14" rx="2" fill="#6B7280"/>
    <text x="28" y="11" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Ann Gray</text>
  </g>

  <!-- Speech bubble flag for comment popup (bottom-center) — cool gray (was green) -->
  <g transform="translate(380,406)">
    <rect width="100" height="14" rx="2" fill="#6B7280"/>
    <text x="50" y="11" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#FFFFFF">Shirley Franklin</text>
  </g>

  <!-- Subtle floor shadow under whole card -->
  <ellipse cx="390" cy="475" rx="320" ry="10" fill="#000000" opacity="0.06"/>
</svg>
