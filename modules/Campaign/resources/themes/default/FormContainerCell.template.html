<div style="<%
    var width = formatter.getFormat('width', 'auto');
    var gap = (typeof cell_gap === 'number' && cell_gap > 0) ? cell_gap : 0;
    var count = (typeof cell_count === 'number' && cell_count > 0) ? cell_count : 1;
    var flexStyle = '';
    if (width === 'auto' || width === null || width === '') {
        flexStyle = '';
    } else if (width === 'fill') {
        flexStyle = 'flex: 1 1 0; min-width: 0;';
    } else {
        var str = String(width).trim();
        if (/%$/.test(str)) {
            var pct = parseFloat(str);
            if (!isNaN(pct) && pct > 0) {
                if (gap > 0 && count > 1) {
                    var gapShare = (gap * (count - 1) / count);
                    flexStyle = 'flex: 0 0 calc(' + pct + '% - ' + gapShare + 'px); min-width: 0;';
                } else {
                    flexStyle = 'flex: 0 0 ' + pct + '%; min-width: 0;';
                }
            } else {
                flexStyle = 'flex: 1 1 0; min-width: 0;';
            }
        } else if (/(px|em|rem|vw|vh|ch|ex)$/i.test(str)) {
            flexStyle = 'flex: 0 0 ' + str + '; min-width: 0;';
        } else {
            var numWidth = parseFloat(str);
            if (!isNaN(numWidth) && numWidth > 0) {
                flexStyle = 'flex: ' + numWidth + ' 1 0; min-width: 0;';
            } else {
                flexStyle = 'flex: 1 1 0; min-width: 0;';
            }
        }
    }

    var height = formatter.getFormat('height');
    var heightStyle = '';
    if (height !== null && height !== '' && height !== undefined) {
        heightStyle = 'height: ' + height + (typeof height === 'number' ? 'px' : '') + ';';
    }

    var otherStyles = formatter.toStyleStringAll().replace(/width:\s*[^;]+;?\s*/gi, '').replace(/height:\s*[^;]+;?\s*/gi, '').trim();
    var finalStyle = (flexStyle + ' ' + heightStyle + ' ' + otherStyles).trim();
%><%- finalStyle %>">
    <% if (blocks && blocks.length) { blocks.forEach(function(block) { %>
        <%- block %>
    <% }); } %>
</div>
