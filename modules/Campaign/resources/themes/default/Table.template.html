<div style="<%- formatter.toStyleStringAll() %>box-sizing: border-box; overflow-x: auto; background-color: <%- formatter.getFormat('background_color', '#ffffff') %>; <% if (!formatter.getFormat('width')) { %>width: 100%;<% } %>">
    <table style="width: 100%; min-width: 320px; border-collapse: collapse; color: #0f172a; font-size: 14px;">
        <% if (headers && headers.length) { %>
            <thead>
                <tr>
                    <% headers.forEach(function(header) { %>
                        <th style="padding: 12px 14px; text-align: left; font-weight: 700; border-bottom: 1px solid rgba(15, 23, 42, 0.14); background: rgba(148, 163, 184, 0.12);">
                            <%- header.text %>
                        </th>
                    <% }); %>
                </tr>
            </thead>
        <% } %>
        <tbody>
            <% rows.forEach(function(row) { %>
                <tr>
                    <% row.cells.forEach(function(cell) { %>
                        <td style="padding: 12px 14px; border-bottom: 1px solid rgba(15, 23, 42, 0.10); vertical-align: top;">
                            <%- cell %>
                        </td>
                    <% }); %>
                </tr>
            <% }); %>
        </tbody>
    </table>
</div>
