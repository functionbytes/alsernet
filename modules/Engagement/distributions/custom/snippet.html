<!--
    Alsernet Live Chat — Custom integration snippet

    Pega este bloque dentro de <head> en cualquier sitio que NO sea PrestaShop,
    Shopify ni WooCommerce. El SDK funciona igual, solo que el merchant es
    responsable de alimentar los datos de carrito/cliente/producto vía
    chat.platform.set({...}).
-->

<script>
(function (w, d) {
    w.chat = w.chat || function () { (w.chat.q = w.chat.q || []).push(arguments); };
})(window, document);
</script>
<script async src="https://panel.alsernet.com/build-engagement/sdk.js"></script>
<script>
window.chat('init', {
    token: 'TU_WEBSITE_TOKEN',
    apiUrl: 'https://panel.alsernet.com',
    consent: true
});
