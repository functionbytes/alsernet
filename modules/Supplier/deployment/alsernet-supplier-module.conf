# ────────────────────────────────────────────────────────────
  # WORKER 1: SINCRONIZACIÓN DE PROVEEDORES (2 instancias)
  # ────────────────────────────────────────────────────────────
  # Jobs: SyncProductsJob, SyncProvidersJob, SyncCategoriesJob,
  #       SyncPricesJob, SyncModelsJob, SyncCategoriesFromErpJob,
  #       SyncProvidersFromErpJob, SyncProviderProductsJob
  [program:Alsernet-supplier-sync]
  process_name=%(program_name)s_%(process_num)02d
  command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=sync --sleep=3 --tries=3 --timeout=3700 --max-time=3600
  autostart=true
  autorestart=true
  numprocs=2
  priority=100
  stdout_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-sync.log
  stdout_logfile_maxbytes=50MB
  stdout_logfile_backups=10
  stderr_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-sync-error.log
  stderr_logfile_maxbytes=50MB
  stderr_logfile_backups=10
  user=www-data
  stopsignal=TERM
  stopwaitsecs=3710
  stopasgroup=true
  redirect_stderr=false
  startretries=3
  startsecs=10
  loglevel=info

  # ────────────────────────────────────────────────────────────
  # WORKER 2: GENERACIÓN DE CONTENIDO CON IA (1 instancia)
  # ────────────────────────────────────────────────────────────
  # Jobs: GenerateAiContentJob, GenerateBulkProductContentJob
  # Solo 1 worker para respetar rate limits de la API de AI.
  [program:Alsernet-supplier-ai-generation]
  process_name=%(program_name)s_%(process_num)02d
  command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=ai-generation,ai-content-generation --sleep=5 --tries=3 --timeout=700 --max-time=3600
  autostart=true
  autorestart=true
  numprocs=1
  priority=200
  stdout_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-ai-generation.log
  stdout_logfile_maxbytes=50MB
  stdout_logfile_backups=10
  stderr_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-ai-generation-error.log
  stderr_logfile_maxbytes=50MB
  stderr_logfile_backups=10
  user=www-data
  stopsignal=TERM
  stopwaitsecs=710
  stopasgroup=true
  redirect_stderr=false
  startretries=3
  startsecs=10
  loglevel=info

  # ────────────────────────────────────────────────────────────
  # WORKER 3: EXTRACCIÓN DE DATOS (2 instancias)
  # ────────────────────────────────────────────────────────────
  # Jobs: ProcessSupplierExtractionJob
  [program:Alsernet-supplier-extraction]
  process_name=%(program_name)s_%(process_num)02d
  command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=supplier-extraction --sleep=3 --tries=3 --timeout=310 --max-time=3600
  autostart=true
  autorestart=true
  numprocs=2
  priority=150
  stdout_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-extraction.log
  stdout_logfile_maxbytes=50MB
  stdout_logfile_backups=10
  stderr_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-extraction-error.log
  stderr_logfile_maxbytes=50MB
  stderr_logfile_backups=10
  user=www-data
  stopsignal=TERM
  stopwaitsecs=320
  stopasgroup=true
  redirect_stderr=false
  startretries=3
  startsecs=10
  loglevel=info

  # ────────────────────────────────────────────────────────────
  # WORKER 4: REINTENTOS DE FALLOS (1 instancia)
  # ────────────────────────────────────────────────────────────
  # Jobs: RetryFailedExecutionJob
  [program:Alsernet-supplier-retry]
  process_name=%(program_name)s_%(process_num)02d
  command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=supplier-retry --sleep=10 --tries=3 --timeout=310 --max-time=3600
  autostart=true
  autorestart=true
  numprocs=1
  priority=300
  stdout_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-retry.log
  stdout_logfile_maxbytes=20MB
  stdout_logfile_backups=5
  stderr_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-retry-error.log
  stderr_logfile_maxbytes=20MB
  stderr_logfile_backups=5
  user=www-data
  stopsignal=TERM
  stopwaitsecs=320
  stopasgroup=true
  redirect_stderr=false
  startretries=3
  startsecs=10
  loglevel=info

  # ────────────────────────────────────────────────────────────
  # WORKER 5: MANTENIMIENTO (1 instancia)
  # ────────────────────────────────────────────────────────────
  # Jobs: CleanupExpiredDataJob
  [program:Alsernet-supplier-maintenance]
  process_name=%(program_name)s_%(process_num)02d
  command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=maintenance --sleep=30 --tries=1 --timeout=3700 --max-time=7200
  autostart=true
  autorestart=true
  numprocs=1
  priority=400
  stdout_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-maintenance.log
  stdout_logfile_maxbytes=20MB
  stdout_logfile_backups=5
  stderr_logfile=/home/webadmin/web/storage/logs/supervisor/supplier-maintenance-error.log
  stderr_logfile_maxbytes=20MB
  stderr_logfile_backups=5
  user=www-data
  stopsignal=TERM
  stopwaitsecs=3710
  stopasgroup=true
  redirect_stderr=false
  startretries=3
  startsecs=10
  loglevel=info
