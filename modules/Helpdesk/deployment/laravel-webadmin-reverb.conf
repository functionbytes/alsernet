# ============================================================
# Reverb (WebSocket) — chat en tiempo real de Helpdesk
# ============================================================
# Copiar tal cual a /etc/supervisor/conf.d/ (mismo nombre de archivo).
# Como el nombre de programa cambia (laravel-webadmin-reverb, para que
# haga juego con laravel-webadmin-horizon.conf) esto NO reemplaza al
# laravel-reverb.conf existente por sobreescritura — hay que borrarlo,
# si no los dos van a pelear por el puerto 8081:
#
#   sudo supervisorctl stop laravel-reverb
#   sudo rm /etc/supervisor/conf.d/laravel-reverb.conf
#   sudo cp devops/supervisor-migracion/webadmin/laravel-webadmin-reverb.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start laravel-webadmin-reverb
# ============================================================
# CORREGIDO 18-sep-2026 (segunda vuelta): la primera version de este
# archivo hacia bind en 0.0.0.0:8081 asumiendo que el navegador conecta
# directo a wss://webadmin.a-alvarez.com:8081. Verificado con openssl
# s_client contra ese puerto publico: nadie completa el handshake TLS ahi
# -- ni Apache (no tiene VirtualHost en :8081, Listen 8081 esta comentado
# en ports.conf) ni el propio Reverb (config/reverb.php tiene 'tls' => []
# fijo, sin leer REVERB_LOCAL_CERT/REVERB_LOCAL_PK pese a que el .env de
# webadminpruebas los define -- estan sin cablear, comprobado con diff
# entre ambos config/reverb.php, son identicos). O sea: conectar directo a
# :8081 con wss:// no puede funcionar en ninguno de los dos entornos tal
# como esta el codigo hoy.
#
# El camino real es el que ya documenta devops/deploy/README.md (tarea
# pendiente de hace tiempo, parcialmente aplicada) y que el vhost de Apache
# YA tiene bajo su bloque :443:
#
#   ProxyPass "/app" "ws://127.0.0.1:8081/app"
#   ProxyPassReverse "/app" "ws://127.0.0.1:8081/app"
#
# Por eso ahora: bind en 127.0.0.1 (no 0.0.0.0 -- el unico consumidor real
# es el Apache de esta misma maquina, plano por dentro, TLS lo pone Apache
# con su certificado real de Let's Encrypt) y el .env pasa a decir
# REVERB_PORT=443 (puerto publico implicito, sin puerto en la URL) en vez
# de 8081 -- requiere ademas `npm run build` para que el JS compilado
# (VITE_REVERB_*, se hornea en build time) recoja el cambio.
#
# El puerto 8081 es exclusivo de webadmin.a-alvarez.com (unico ServerName
# que lo referencia en todos los vhosts de Apache; webadminpruebas usa el
# 8080, que este archivo no toca). El proceso que hoy lo ocupa sirve a
# /home2/webadminpruebas/web, NO a este proyecto -- el laravel-reverb.conf
# instalado dice en su propio comentario que "corrigio" un target roto
# apuntandolo al lugar equivocado. Se borra, no le sirve a nadie tal como
# esta.
#
# Detectado y confirmado el 2026-09-18: cada mensaje nuevo dispara dos
# broadcasts ShouldBroadcastNow (ConversationMessageCreated +
# BroadcastInboxSummary) que sin un Reverb real respondiendo tardan 10s
# cada uno en fallar (timeout) antes de rendirse en silencio — ni el chat
# ni el listado de conversaciones se actualizan solos, solo al hacer click.
# ============================================================

[program:laravel-webadmin-reverb]
process_name=%(program_name)s
command=/usr/bin/php /home/webadmin/web/artisan reverb:start --host=127.0.0.1 --port=8081
directory=/home/webadmin/web
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
stopsignal=TERM
priority=15
