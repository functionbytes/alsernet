# ============================================================
# Módulo Document — Configuración Supervisor
# ============================================================
# Copiar a: /etc/supervisor/conf.d/laravel-document.conf
# Activar con:
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start all
# ============================================================

# ------------------------------------------------------------
# Worker: emails de documentos (solicitudes, recordatorios,
# aprobaciones, rechazos, confirmaciones de subida)
# ------------------------------------------------------------
[program:laravel-document-emails-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work database --queue=emails --sleep=3 --tries=3 --max-time=300 --timeout=300
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-document-emails-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
priority=999

# ------------------------------------------------------------
# Worker: SLA y cola general del módulo Document
# ------------------------------------------------------------
[program:laravel-document-default-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work database --queue=default --sleep=3 --tries=3 --max-time=300 --timeout=300
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-document-default-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
priority=999
