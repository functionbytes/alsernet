; Worker dedicado al post-procesamiento de mensajes de Helpdesk (traduccion,
; sentiment, auto-tag, automatizaciones, agente IA) — separado del worker de
; webhooks para que el post-procesamiento pesado nunca bloquee la ingesta de
; mensajes nuevos. Replica el servicio "worker-events" de docker-compose.
[program:laravel-worker-events]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=helpdesk-events --sleep=0.5 --tries=3 --timeout=60 --max-jobs=1000
directory=/var/www
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor/worker-events.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=65
priority=999
