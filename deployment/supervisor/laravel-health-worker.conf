[program:laravel-health-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=health --sleep=3 --tries=3 --max-time=300 --timeout=300
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor/health-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=10
priority=999
