; ============================================================
; Supervisor — Módulo Supplier (sincronización ERP + IA)
; Copiar a: /etc/supervisor/conf.d/alsernet-supplier-module.conf
; Recargar: supervisorctl reread && supervisorctl update
; ============================================================

; ── Worker: sincronización ERP ────────────────────────────────────────────────
; Procesa: SyncModelsJob, SyncProvidersJob, SyncCategoriesJob, SyncPricesJob,
;          SyncCategoriesFromErpJob, SyncProvidersFromErpJob, SyncProviderProductsJob
[program:alsernet-supplier-sync]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=sync --sleep=3 --tries=3 --timeout=3700 --max-time=3600
autostart=true
autorestart=true
numprocs=2
priority=100
user=www-data
stopsignal=TERM
stopwaitsecs=3710
stopasgroup=true
redirect_stderr=false
startretries=3
startsecs=10
loglevel=info
stdout_logfile=/var/www/storage/logs/supervisor/supplier-sync.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/www/storage/logs/supervisor/supplier-sync-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ── Worker: generación IA ─────────────────────────────────────────────────────
; Procesa: GenerateAiContentJob, GenerateBulkProductContentJob
; 1 solo proceso para respetar rate limits de la API de IA.
[program:alsernet-supplier-ai-generation]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=ai-generation,ai-content-generation --sleep=5 --tries=3 --timeout=700 --max-time=3600
autostart=true
autorestart=true
numprocs=1
priority=200
user=www-data
stopsignal=TERM
stopwaitsecs=710
stopasgroup=true
redirect_stderr=false
startretries=3
startsecs=10
loglevel=info
stdout_logfile=/var/www/storage/logs/supervisor/supplier-ai-generation.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/www/storage/logs/supervisor/supplier-ai-generation-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ── Worker: extracción de documentos ──────────────────────────────────────────
; Procesa: ProcessSupplierExtractionJob
[program:alsernet-supplier-extraction]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=supplier-extraction --sleep=3 --tries=3 --timeout=310 --max-time=3600
autostart=true
autorestart=true
numprocs=2
priority=150
user=www-data
stopsignal=TERM
stopwaitsecs=320
stopasgroup=true
redirect_stderr=false
startretries=3
startsecs=10
loglevel=info
stdout_logfile=/var/www/storage/logs/supervisor/supplier-extraction.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/www/storage/logs/supervisor/supplier-extraction-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; ── Worker: reintentos fallidos ───────────────────────────────────────────────
; Procesa: RetryFailedExecutionJob
[program:alsernet-supplier-retry]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=supplier-retry --sleep=10 --tries=3 --timeout=310 --max-time=3600
autostart=true
autorestart=true
numprocs=1
priority=300
user=www-data
stopsignal=TERM
stopwaitsecs=320
stopasgroup=true
redirect_stderr=false
startretries=3
startsecs=10
loglevel=info
stdout_logfile=/var/www/storage/logs/supervisor/supplier-retry.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/www/storage/logs/supervisor/supplier-retry-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5

; ── Worker: mantenimiento ─────────────────────────────────────────────────────
; Procesa: CleanupExpiredDataJob
[program:alsernet-supplier-maintenance]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=maintenance --sleep=30 --tries=1 --timeout=3700 --max-time=7200
autostart=true
autorestart=true
numprocs=1
priority=400
user=www-data
stopsignal=TERM
stopwaitsecs=3710
stopasgroup=true
redirect_stderr=false
startretries=3
startsecs=10
loglevel=info
stdout_logfile=/var/www/storage/logs/supervisor/supplier-maintenance.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/www/storage/logs/supervisor/supplier-maintenance-error.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
