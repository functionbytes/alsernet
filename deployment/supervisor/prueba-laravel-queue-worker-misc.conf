; Worker NUEVO — cubre colas del ecosistema Helpdesk que NINGUN worker actual
; consume (ni docker-compose.yml ni el resto de deployment/supervisor/*.conf).
; Se confirmo en Redis (system-redis) que varias tenian jobs acumulados sin
; procesar: helpdesk-erp, helpdesk-ps, etc.
;
; Recortado a SOLO Helpdesk (a peticion expresa) — se excluyeron ~22 colas
; que pertenecen a otros modulos sin relacion con Helpdesk (Remarketing, Reviews,
; Mailrelay, Engagement, Blog, Seo, Page, Shortcode, Ecommerce, Media, Campaign,
; Attention). Si mas adelante hace falta procesarlas tambien, ver el listado
; completo (34 colas) que se genero en la primera version de este archivo.
;
; Colas cubiertas y su modulo:
;   helpdesk-ai          -> HelpdeskAgents, HelpdeskHelpcenter
;   helpdesk-broadcasts  -> Helpdesk
;   helpdesk-embeddings  -> HelpdeskAgents
;   helpdesk-erp         -> HelpdeskErp
;   helpdesk-erp-warming -> HelpdeskErp
;   helpdesk-ps          -> HelpdeskPrestashop
;   helpdesk-ps-warming  -> HelpdeskPrestashop
;   helpdesk-scheduled   -> HelpdeskTickets
;   helpdesk-audit       -> HelpdeskTickets (RecordTicketHistory: historial de tickets)
;   helpdeskcompliance   -> HelpdeskCompliance
;   helpdesklivechat     -> Engagement (widget de chat en vivo embebido)
;   campaigns-scheduler  -> HelpdeskCampaigns
;   impressions          -> HelpdeskCampaigns
;   helpdesk-social-*    -> HelpdeskSocial (webhooks/processing/analytics/ai) —
;                           inertes hasta reactivar el módulo, pero ya con worker.
;
; NOTA: config/horizon.php ya trae supervisores afinados (auto-scaling,
; timeouts especificos) para varias de estas colas — evaluar migrar a
; "php artisan horizon" en vez de mantener este archivo a mano.
[program:laravel-queue-worker-misc]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=helpdesk-ai,helpdesk-audit,helpdesk-broadcasts,helpdesk-embeddings,helpdesk-erp,helpdesk-erp-warming,helpdesk-ps,helpdesk-ps-warming,helpdesk-scheduled,helpdeskcompliance,helpdesklivechat,campaigns-scheduler,impressions,helpdesk-social-webhooks,helpdesk-social-processing,helpdesk-social-analytics,helpdesk-social-ai --sleep=1 --tries=3 --timeout=300 --max-jobs=500
directory=/var/www
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor/queue-worker-misc.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=310
priority=999
