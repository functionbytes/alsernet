; Worker principal — colas del ecosistema Helpdesk + las que son
; genuinamente compartidas (Helpdesk las usa junto a otros modulos, asi que
; no se pueden quitar sin dejar sin procesar jobs de Helpdesk tambien):
;   - webhooks: Campaign, Ecommerce, Forms, Helpdesk, Reviews
;   - emails: Attention, Document, Ecommerce, Forms, Helpdesk, HelpdeskAgents,
;     HelpdeskEmailLog, HelpdeskIntegration, HelpdeskLivechat, HelpdeskTickets, Reviews
;   - notifications: Helpdesk, HelpdeskIntegration, HelpdeskSocial, Page
;   - default: fallback universal (Auth, Document, Ecommerce, Forms,
;     HelpdeskLivechat, Page, Template) — nunca se quita, es el catch-all
; Puramente Helpdesk: notifications-high, helpdesk, chatflow (HelpdeskChatFlow),
; broadcasts, drip.
;
; Se quitaron respecto al worker original de docker-compose (por NO ser de
; Helpdesk): exports (Attention/Ecommerce/Forms/Reviews), high (Mailrelay).
; sync y low se mantienen por precaucion — no se pudo confirmar via grep
; onQueue() a que modulo pertenecen (podrian dispatcharse via propiedad
; $queue en la Job class en vez de ->onQueue()); verificar antes de quitarlas.
[program:laravel-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=webhooks,notifications-high,helpdesk,chatflow,emails,notifications,broadcasts,sync,drip,default,low --sleep=0.5 --tries=3 --timeout=960 --max-jobs=500
directory=/var/www
autostart=true
autorestart=true
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=970
priority=999
