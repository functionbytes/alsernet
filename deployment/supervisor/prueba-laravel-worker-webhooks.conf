; Worker dedicado a webhooks entrantes de canales sociales (WhatsApp/Facebook/
; Instagram) — SOLO ingesta (crear cliente/conversacion/item + broadcast).
; sleep=0 para latencia minima: un mensaje nuevo nunca debe esperar detras de
; post-procesamiento pesado. Replica el servicio "worker-webhooks" de
; docker-compose.
[program:laravel-worker-webhooks]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/artisan queue:work redis --queue=helpdesk-webhooks --sleep=0 --tries=3 --timeout=60 --max-jobs=1000
directory=/var/www
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/supervisor/worker-webhooks.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=65
priority=999
