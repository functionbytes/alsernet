# E2E — nginx for the Laravel panel. Deliberately minimal: no Reverb proxy,
# no static asset tuning (docker/nginx/conf.d/default.conf requires the reverb
# service and would fail to boot in this compose).
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass panel:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
