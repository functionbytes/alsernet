<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InoqualabSystem API — Swagger UI</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Swagger UI CDN -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />

  <style>
    /* ── Base ──────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #212529;
    }

    /* ── Top bar ──────────────────────────── */
    #topbar {
      background: #1d2939;
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      gap: 16px;
    }

    #topbar .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    #topbar .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b10100;
      flex-shrink: 0;
    }

    #topbar h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .02em;
    }

    #topbar .version-badge {
      background: #b10100;
      color: #fff;
      font-size: .7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    #topbar .links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    #topbar .links a {
      color: rgba(255,255,255,.75);
      text-decoration: none;
      font-size: .85rem;
      transition: color .15s;
    }

    #topbar .links a:hover { color: #fff; }

    /* ── Swagger UI overrides ─────────────── */
    .swagger-ui .topbar { display: none !important; }

    .swagger-ui .info .title {
      color: #1d2939;
    }

    .swagger-ui .btn.authorize {
      background: #b10100;
      border-color: #b10100;
      color: #fff;
    }

    .swagger-ui .btn.authorize:hover {
      background: #7da310;
    }

    .swagger-ui .opblock.opblock-get    .opblock-summary-method { background: #0d6efd; }
    .swagger-ui .opblock.opblock-post   .opblock-summary-method { background: #13C672; }
    .swagger-ui .opblock.opblock-put    .opblock-summary-method { background: #FEC90F; color: #212529; }
    .swagger-ui .opblock.opblock-patch  .opblock-summary-method { background: #fd7e14; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #FA896B; }

    #swagger-ui {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    /* ── Loading state ────────────────────── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 16px;
      gap: 16px;
      color: #6c757d;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #dee2e6;
      border-top-color: #b10100;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ── Top bar ──────────────────────────────────── -->
<div id="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <h1>InoqualabSystem API</h1>
    <span class="version-badge">v1.0</span>
  </div>
  <nav class="links">
    <a href="/api/v1/ping" target="_blank" rel="noopener">Ping</a>
    <a href="/api/v1/health" target="_blank" rel="noopener">Health</a>
    <a href="openapi.yaml" download>Download YAML</a>
  </nav>
</div>

<!-- ── Swagger UI mount ─────────────────────────── -->
<div id="swagger-ui">
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading API documentation…</p>
  </div>
</div>

<!-- Swagger UI scripts -->
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
<script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>

<script>
  window.addEventListener('load', function () {
    var ui = SwaggerUIBundle({
      url: 'openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset,
      ],
      plugins: [
        SwaggerUIBundle.plugins.DownloadUrl,
      ],
      layout: 'StandaloneLayout',
      // Show operations expanded by tag
      docExpansion: 'list',
      // Show all operation request bodies and models
      defaultModelsExpandDepth: 1,
      defaultModelExpandDepth: 2,
      // Persist auth between page loads
      persistAuthorization: true,
      // Request interceptor — inject CSRF token for same-origin web routes
      requestInterceptor: function (request) {
        var meta = document.querySelector('meta[name="csrf-token"]');
        if (meta) {
          request.headers['X-CSRF-TOKEN'] = meta.getAttribute('content');
        }
        return request;
      },
      onComplete: function () {
        var loading = document.getElementById('loading');
        if (loading) loading.remove();
      },
    });

    window.ui = ui;
  });
</script>

</body>
</html>
