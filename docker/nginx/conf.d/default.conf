server {
    listen 80;
    server_name system-docker.test localhost 127.0.0.1 _;
    root /var/www/public;
    index index.php index.html index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Client body size limit
    client_max_body_size 100M;

    # Favicon and robots
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP handling (must come before static files to allow /theme-asset/* routes)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files (only for /public/build and actual static files that exist)
    # IMPORTANT: Exclude /theme-asset/* so Laravel AssetController can handle it
    location ~* ^/theme-asset/ {
        # Pass to Laravel for routing through AssetController
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Built assets from Vite
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Deny access to Laravel storage
    location ~ ^/storage/ {
        deny all;
    }

    # Deny access to Laravel bootstrap
    location ~ ^/bootstrap/ {
        deny all;
    }
}

# Fix for cloudflared
proxy_http_version 1.1;
proxy_set_header Connection "";
