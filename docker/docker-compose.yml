name: system

services:

  # Servicio Laravel/PHP
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: system
    container_name: system-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./php/fpm-zz-custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
    networks:
      - system-network
    platform: linux/amd64
    # Permitir acceso a la red del host Mac
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "manager.test:host-gateway"
      - "oracle.local:192.168.253.8"
    # Configurar DNS para resolver IPs externas
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Permitir traffic de red externa
    cap_add:
      - NET_ADMIN
    # Aumentar límites de archivos abiertos
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env

  # Redis — caché, sesiones y colas
  redis:
    image: redis:7-alpine
    container_name: system-redis
    restart: unless-stopped
    command: redis-server --requirepass 6cWRY1PUmiwYciQxJXkg
    ports:
      - "6380:6379"
    networks:
      - system-network

  # Redis Commander — UI web para Redis → http://localhost:8082
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: system-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:6cWRY1PUmiwYciQxJXkg
    networks:
      - system-network
    depends_on:
      - redis

  # Mailpit — captura de emails en desarrollo
  mailpit:
    image: axllent/mailpit:latest
    container_name: system-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"   # SMTP
      - "8026:8025"   # Web UI → http://localhost:8026
    networks:
      - system-network

  # Queue worker — procesa colas sync, high, default, low
  worker:
    image: system
    container_name: system-worker
    restart: unless-stopped
    working_dir: /tmp
    command: php /var/www/artisan queue:work redis --queue=webhooks,notifications-high,helpdesk,chatflow,emails,notifications,broadcasts,exports,sync,drip,high,default,low --sleep=0.5 --tries=3 --timeout=960 --max-jobs=500
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    networks:
      - system-network
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "oracle.local:192.168.253.8"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env
    depends_on:
      - app
      - redis

  # Worker dedicado a webhooks entrantes (WhatsApp/Facebook/Instagram) — SOLO
  # ingesta (crear cliente/conversación/ítem + broadcast). sleep=0 para latencia
  # mínima. helpdesk-events vive en su propio worker (abajo) para que un
  # mensaje nuevo nunca espere detrás del post-procesamiento (traducción,
  # sentiment, auto-tag, IA) del mensaje anterior.
  worker-webhooks:
    image: system
    container_name: system-worker-webhooks
    restart: unless-stopped
    working_dir: /tmp
    command: php /var/www/artisan queue:work redis --queue=helpdesk-webhooks --sleep=0 --tries=3 --timeout=60 --max-jobs=1000
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    networks:
      - system-network
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "oracle.local:192.168.253.8"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env
    depends_on:
      - app
      - redis

  # Worker dedicado al post-procesamiento de mensajes (traducción, sentiment,
  # auto-tag, automatizaciones, agente IA) — separado de worker-webhooks para
  # que nunca bloquee la ingesta de mensajes nuevos.
  worker-events:
    image: system
    container_name: system-worker-events
    restart: unless-stopped
    working_dir: /tmp
    command: php /var/www/artisan queue:work redis --queue=helpdesk-events --sleep=0.5 --tries=3 --timeout=60 --max-jobs=1000
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    networks:
      - system-network
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "oracle.local:192.168.253.8"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env
    depends_on:
      - app
      - redis

  # Worker "misc" — colas de contexto/segundo plano no críticas para la ingesta:
  # IA del bot, embeddings, contexto ERP/PrestaShop y su warming, GDPR, livechat,
  # scheduler de campañas e impresiones. Espeja prueba-laravel-queue-worker-misc.conf
  # de producción (supervisor); sin esto, en el Docker local esas colas no se
  # procesaban y sus jobs quedaban acumulados en Redis.
  worker-misc:
    image: system
    container_name: system-worker-misc
    restart: unless-stopped
    working_dir: /tmp
    command: php /var/www/artisan queue:work redis --queue=helpdesk-ai,helpdesk-audit,helpdesk-broadcasts,helpdesk-embeddings,helpdesk-erp,helpdesk-erp-warming,helpdesk-ps,helpdesk-ps-warming,helpdesk-scheduled,helpdeskcompliance,helpdesklivechat,campaigns-scheduler,impressions,helpdesk-social-webhooks,helpdesk-social-processing,helpdesk-social-analytics,helpdesk-social-ai --sleep=1 --tries=3 --timeout=300 --max-jobs=500
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    networks:
      - system-network
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "oracle.local:192.168.253.8"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env
    depends_on:
      - app
      - redis

  # Scheduler — ejecuta artisan schedule:run cada minuto
  scheduler:
    image: system
    container_name: system-scheduler
    restart: unless-stopped
    working_dir: /tmp
    command: >
      sh -c "while true; do php /var/www/artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    networks:
      - system-network
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "oracle.local:192.168.253.8"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env
    depends_on:
      - app
      - redis

  # Reverb — servidor WebSocket para broadcasting en tiempo real (solo interno,
  # sin puerto publicado al host; nginx lo expone via proxy en /app/)
  reverb:
    image: system
    container_name: system-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php /var/www/artisan reverb:start --host=0.0.0.0 --port=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ../src:/var/www
      - ./php/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    networks:
      - system-network
    platform: linux/amd64
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "oracle.local:192.168.253.8"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    # Un servidor WebSocket mantiene un file descriptor por conexion abierta —
    # necesita el mismo limite ampliado que app/worker/scheduler.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    env_file:
      - ./laravel.env
    environment:
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    depends_on:
      - redis

  # Servicio Nginx
  nginx:
    image: nginx:alpine
    container_name: system-nginx
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8490:443"
    volumes:
      - ../src:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - system-network
    depends_on:
      - app
      - reverb
    dns:
      - 127.0.0.1
      - 8.8.8.8
    environment:
      - SERVER_NAME=system-docker.test
      - UPSTREAM_HOST=app
      - UPSTREAM_PORT=9000

networks:
  system-network:
    driver: bridge
    driver_opts:
      # Permitir acceso a redes externas
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1
