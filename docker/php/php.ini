[PHP]
; Execution
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Memory
memory_limit = 512M

; File uploads
upload_max_filesize = 100M
post_max_size = 100M

; Display errors
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /proc/self/fd/2

; Date
date.timezone = Europe/Paris

; Session
session.save_handler = files
session.save_path = "/tmp"
session.gc_maxlifetime = 1440
session.gc_probability = 1
session.gc_divisor = 1000


; OPCache — validate_timestamps=1: detecta cambios en .php sin reiniciar
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1

[oci8]
; Deshabilitar DRCP (connection_class) — el registro al pool Oracle al
; inicializar cada worker provoca un intento de conexión TCP que timeout-ea
; (~43-70 s) cuando el servidor Oracle no es alcanzable desde Docker.
oci8.connection_class =
; -1 = no hacer ping a conexiones persistentes; evita reconexión en background
oci8.ping_interval = -1
