# LibreTranslate — local self-hosted translation API.
#
# Run with:
#   docker compose -f docker-compose.libretranslate.yml up -d
#
# First boot downloads NMT models for the languages listed in --load-only
# (~200-400 MB per language pair). Models live inside the container so a
# container removal forces a re-download. For dev/testing this is fine; for
# production, switch to a bind mount with `chown 1032:1032` set ahead of time.
#
# After it's healthy, configure the HelpdeskTranslate panel:
#   Provider:  LibreTranslate
#   Endpoint:  http://localhost:5050/translate
#
# To stop:    docker compose -f docker-compose.libretranslate.yml down

services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate
    restart: unless-stopped
    ports:
      - "5050:5000"
    # Whitelist only the languages we actually use to keep RAM/disk low.
    # Remove this line to load every language (~6GB RAM, ~5GB disk).
    command: --load-only es,en,pt,fr,de,it --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:5000/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
