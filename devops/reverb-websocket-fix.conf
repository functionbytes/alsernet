# FIX REAL para el WebSocket de Reverb en Apache.
#
# Diagnostico confirmado con captura de trafico real (socat en el puerto
# 8080, bypaseando Reverb un momento): Apache reenvia la peticion al
# backend como HTTP/1.0 y SIN los headers "Connection: Upgrade" /
# "Upgrade: websocket" - mod_proxy_http los trata como hop-by-hop y los
# descarta antes de que mod_proxy_wstunnel pueda tomar el control real
# del tunel (el log muestra "handler fallback" en las 3 etapas de
# wstunnel, siempre). Por eso Reverb responde 500: recibe un GET normal,
# no un upgrade real.
#
# La solucion estandar documentada para este sintoma exacto: reemplazar
# el ProxyPass estatico por un RewriteRule con la bandera [P], que invoca
# mod_proxy por un camino distinto y SI preserva los headers de upgrade.
#
# APLICAR: dentro del bloque <VirtualHost ...:8081> (o el que se este
# usando para el WebSocket), buscar estas 2 lineas:
#
#     ProxyPass "/app" "ws://127.0.0.1:8080/app"
#     ProxyPassReverse "/app" "ws://127.0.0.1:8080/app"
#
# Y REEMPLAZARLAS por esto:

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app(.*)$ ws://127.0.0.1:8080/app$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/app(.*)$ http://127.0.0.1:8080/app$1 [P,L]

    ProxyPassReverse "/app" "ws://127.0.0.1:8080/app"

# Nota: como el vhost de 8081 ya tiene su propio "RewriteEngine On" con
# reglas de bloqueo SQL/IP, agregar estas 4 lineas de Rewrite DESPUES de
# esas reglas (no antes), para no alterar el orden de evaluacion existente.
