; Worker de tiempo real para Helpdesk — colas de cara al cliente (ingesta de
; mensajes entrantes vía webhook, auto-respuestas de conversación, eventos/
; broadcasts en vivo, notificaciones de alta prioridad). Separado el
; 7-ago-2026 de laravel-queue-helpdesk.conf (que se queda con las colas de
; fondo: IA/embeddings/ERP/PS warming, social analytics, compliance,
; chatflow, drip, emails masivos, livechat, scheduler) — un job lento de
; fondo (traducción, IA, embeddings) no debe retrasar en fila un mensaje
; real a un cliente esperando en el chat. --max-time más corto que el
; worker de fondo (600 vs 3600): si algo aquí tarda de verdad, es señal de
; que algo va mal, no que sea trabajo legítimamente pesado.
;
; Instalacion: ver laravel-queue-helpdesk.conf (mismo procedimiento).

[program:laravel-queue-helpdesk-realtime]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work redis --queue=helpdesk-webhooks,helpdesk,helpdesk-events,helpdesk-broadcasts,broadcasts,notifications-high --sleep=1 --tries=3 --max-time=600
directory=/home/webadmin/web
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/queue-helpdesk-realtime.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=LARAVEL_ENV=production
user=www-data
startsecs=5
stopwaitsecs=60
priority=998
