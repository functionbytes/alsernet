; Worker de tiempo real para Helpdesk — colas de cara al cliente (ingesta de
; mensajes entrantes vía webhook, auto-respuestas de conversación, eventos/
; broadcasts en vivo, notificaciones de alta prioridad). Separado el
; 7-ago-2026 de laravel-queue-helpdesk.conf (que se queda con las colas de
; fondo: IA/embeddings/ERP/PS warming, social analytics, compliance,
; chatflow, drip, emails masivos, livechat, scheduler) — un job lento de
; fondo (traducción, IA, embeddings) no debe retrasar en fila un mensaje
; real a un cliente esperando en el chat. --max-time más corto que el
; worker de fondo (600 vs 3600): si algo aquí tarda de verdad, es señal de
; que algo va mal, no que sea trabajo legítimamente pesado.
;
; Instalacion: ver laravel-queue-helpdesk.conf (mismo procedimiento).

; 8-sep-2026: `queue:work` con varias colas separadas por coma las vacía en
; el ORDEN en que aparecen aquí (agota la primera antes de mirar la
; siguiente, y vuelve a empezar por la primera en cada ciclo) — no es
; round-robin. El orden real dejaba helpdesk-broadcasts en 4º lugar de 6,
; justo lo contrario de lo que dice el propio
; App\Events\Concerns\BroadcastsOnServedQueue ("va ANTES en el orden de
; prioridad"): con solo 2 procesos para 6 colas, un goteo normal de
; helpdesk/helpdesk-events bastaba para retrasar "está escribiendo",
; presencia, el banner de ticket nuevo/reasignado y los avisos de SLA —
; los 27 eventos que usan ese trait. helpdesk-webhooks sigue primero (es
; la ingesta real de mensajes de cliente, la raíz de todo lo demás);
; helpdesk-broadcasts pasa a 2º, delante de las dos colas de negocio más
; lentas.
[program:laravel-queue-helpdesk-realtime]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work redis --queue=helpdesk-webhooks,helpdesk-broadcasts,helpdesk,helpdesk-events,broadcasts,notifications-high --sleep=1 --tries=3 --max-time=600
directory=/home/webadmin/web
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/queue-helpdesk-realtime.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=LARAVEL_ENV=production
user=www-data
startsecs=5
stopwaitsecs=60
priority=998
