; Worker dedicado a la queue 'helpdesk-events' (HelpdeskTranslate).
; Procesa auto-traducción de mensajes entrantes y salientes.
; Sin este worker, la traducción automática nunca ejecuta.
; Copiar a /opt/homebrew/etc/supervisor.d/helpdesk-translate-worker.ini y recargar.

[program:helpdesk-translate-worker]
process_name=%(program_name)s_%(process_num)02d
command=/Users/developerts/Herd/system/devops/supervisor/run-php.sh queue:work --queue=helpdesk-events,default --sleep=3 --tries=2 --max-time=3600 --backoff=10
directory=/Users/developerts/Herd/system
autostart=true
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
killasgroup=true
user=developerts
numprocs=2
redirect_stderr=true
stdout_logfile=/Users/developerts/Herd/system/storage/logs/helpdesk-translate-worker.log
stopwaitsecs=3600
