; Worker propio de webadmin para las colas de Helpdesk (mensajería,
; notificaciones, scheduler, etc). Antes de aislar REDIS_DB (webadmin ahora
; usa REDIS_DB=1, separado de webadminpruebas que sigue en REDIS_DB=0),
; estas colas eran procesadas por el Horizon de webadminpruebas por
; coincidencia de nombre de cola en el mismo Redis — corrompiendo datos al
; escribir en la base equivocada. Ver commit que agrega este archivo.
;
; 5-ago-2026: añadidas 'emails' (la cola con más despachadores del proyecto —
; CustomerOutboundEmail, tickets, email log, etc. — que no tenía NINGÚN
; worker propio de webadmin: laravel-queue-worker.conf/queue-worker.service
; apuntan al artisan de webadminpruebas, un proyecto distinto) y
; 'helpdesklivechat' (EngagementBridgeListener). Ver inventario completo de
; colas en memoria de sesión — 'default' y varias colas de Media/Supplier/
; Prestashop/Erp/sync siguen sin worker dedicado, fuera de alcance de este
; cambio (solo Helpdesk + emails/livechat).
;
; 7-ago-2026: añadidas 'helpdesk-audit' (RecordTicketHistory — quedaban
; huérfanos los eventos TicketCreated/TicketAssigned, sin escribir historial
; de auditoría de tickets) y 'helpdesk-social-ai'/'helpdesk-social-analytics'/
; 'helpdesk-social-processing' (SyncSocialCommentsJob/CalculateSocialMetricsJob
; de HelpdeskSocial, misma familia Helpdesk, mismo olvido).
;
; Instalacion:
; sudo cp devops/supervisor/laravel-queue-helpdesk.conf /etc/supervisor/conf.d/
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl start laravel-queue-helpdesk:*

[program:laravel-queue-helpdesk]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work redis --queue=helpdesk-webhooks,helpdesk,helpdesk-events,helpdesk-scheduled,helpdesk-ai,helpdesk-broadcasts,helpdesk-embeddings,helpdesk-erp,helpdesk-erp-warming,helpdesk-ps,helpdesk-ps-warming,helpdesk-audit,helpdesk-social-ai,helpdesk-social-analytics,helpdesk-social-processing,helpdeskcompliance,notifications,notifications-high,impressions,webhooks,broadcasts,campaigns-scheduler,chatflow,drip,emails,helpdesklivechat --sleep=1 --tries=3 --max-time=3600
directory=/home/webadmin/web
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/queue-helpdesk.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=LARAVEL_ENV=production
user=www-data
startsecs=5
stopwaitsecs=60
priority=999
