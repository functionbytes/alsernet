; Reverb WebSocket server — corrige el bug del deploy actual.
;
; El archivo LIVE en /etc/supervisor/conf.d/laravel-reverb.conf apunta a
; /home2/webadmin/web/artisan (este mismo proyecto), pero este proyecto
; NO tiene el paquete laravel/reverb instalado (composer.json no lo lista),
; por eso el proceso queda en FATAL con:
;   "There are no commands defined in the reverb namespace"
;
; El servidor Reverb real vive en el proyecto webadminpruebas
; (composer.json sí tiene "laravel/reverb": "^1.10"). Este archivo corrige
; la ruta para apuntar ahi, igual que ya estaba correctamente definido en
; devops/supervisor/laravel-reverb.conf y deployment/supervisor/laravel-reverb.conf
; de este mismo proyecto (via el symlink /home2 -> /home).
;
; Instalacion (reemplaza el conf roto):
; sudo cp devops/supervisor/prueba-laravel-reverb.conf /etc/supervisor/conf.d/laravel-reverb.conf
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl restart laravel-reverb:*

[program:laravel-reverb]
process_name=%(program_name)s
command=/usr/bin/php /home2/webadminpruebas/web/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
priority=999
