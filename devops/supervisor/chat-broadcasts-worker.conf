; Queue worker dedicated to the 'broadcasts' queue (Chat real-time events).
; MessageSent, AgentTypingEvent, ConversationStatusChanged etc. are pushed
; here. Without a worker, broadcasts never fire — the widget would never
; receive agent replies in real time.
; Copy to /opt/homebrew/etc/supervisor.d/chat-broadcasts-worker.ini and reload.

[program:chat-broadcasts-worker]
process_name=%(program_name)s_%(process_num)02d
command=/Users/developerts/Herd/system/devops/supervisor/run-php.sh queue:work --queue=broadcasts,default --sleep=3 --tries=3 --max-time=3600 --backoff=3
directory=/Users/developerts/Herd/system
autostart=true
autorestart=true
startsecs=2
startretries=3
stopasgroup=true
killasgroup=true
user=developerts
numprocs=2
redirect_stderr=true
stdout_logfile=/Users/developerts/Herd/system/storage/logs/chat-broadcasts-worker.log
stopwaitsecs=3600
