; Reverb WebSocket server for real-time chat
; Listens on 0.0.0.0:8080, restarts on crash, logs to storage/logs.
; Copy to /opt/homebrew/etc/supervisor.d/reverb.ini and reload supervisord.

[program:reverb]
process_name=%(program_name)s_%(process_num)02d
command=/Users/developerts/Herd/system/devops/supervisor/run-php.sh reverb:start --host=0.0.0.0 --port=8090
directory=/Users/developerts/Herd/system
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
user=developerts
numprocs=1
redirect_stderr=true
stdout_logfile=/Users/developerts/Herd/system/storage/logs/reverb.log
stopwaitsecs=10
