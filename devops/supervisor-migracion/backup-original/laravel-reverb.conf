; CORRECCION del laravel-reverb.conf desplegado en /etc/supervisor/conf.d/,
; que apunta mal a /home2/webadmin/web (proyecto sin el paquete laravel/reverb
; instalado -> FATAL "no commands defined in reverb namespace").
; Este archivo apunta al proyecto correcto: webadminpruebas.
;
; Instalacion (reemplaza el conf roto):
; sudo cp devops/supervisor/laravel-reverb.conf /etc/supervisor/conf.d/laravel-reverb.conf
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl restart laravel-reverb

[program:laravel-reverb]
process_name=%(program_name)s
command=/usr/bin/php /home2/webadminpruebas/web/artisan reverb:start --host=0.0.0.0 --port=8081
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
priority=999
