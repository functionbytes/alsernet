# ═══════════════════════════════════════════════════════════════════════════
# LARAVEL QUEUE WORKERS - CONFIGURACIÓN RÁPIDA FUNCIONAL
# ═══════════════════════════════════════════════════════════════════════════
#
# INSTALACIÓN:
# sudo supervisorctl reread
# sudo supervisorctl update
# sudo supervisorctl restart all
#
# ═══════════════════════════════════════════════════════════════════════════

# WORKER 0: HEALTH (CRÍTICO)
[program:laravel-health-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work database --queue=health --sleep=3 --tries=3 --max-time=300 --timeout=300 --max-jobs=1000
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-health-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
priority=1

# ═══════════════════════════════════════════════════════════════════════════

# WORKER 1: EMAILS (PRIORITARIO - RÁPIDO)
[program:laravel-queue-emails]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=emails --sleep=1 --tries=3 --timeout=60 --max-jobs=500
autostart=true
autorestart=true
numprocs=5
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/laravel-queue-emails.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=300
priority=10

# ═══════════════════════════════════════════════════════════════════════════

# WORKER 2: DEFAULT + NOTIFICATIONS
[program:laravel-queue-default]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=default,notifications --sleep=1 --tries=3 --timeout=60 --max-jobs=500
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/laravel-queue-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=300
priority=20

# ═══════════════════════════════════════════════════════════════════════════

# WORKER 3: ERP
[program:laravel-queue-erp]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work --queue=erp --sleep=1 --tries=1 --timeout=60 --max-jobs=500
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/laravel-queue-erp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
user=www-data
startsecs=10
stopwaitsecs=300
priority=30

# ═══════════════════════════════════════════════════════════════════════════
