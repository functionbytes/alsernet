# ============================================================
# Módulo PriceLabels — Configuración Supervisor
# ============================================================
# Copiar tal cual a /etc/supervisor/conf.d/ (mismo nombre de archivo).
# Activar con:
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start all
# ============================================================
# Sin este worker, GeneratePriceLabelPdfJob (cola "exports") se queda
# encolado para siempre y el boton "Generar PDF" del editor de plantillas
# se queda en "Procesando en segundo plano..." sin terminar nunca — nadie
# mas escucha esa cola (no esta cubierta por laravel-queue-worker.conf ni
# por laravel-queue-helpdesk.conf). Detectado y confirmado el 2026-09-07.
# ============================================================

# ------------------------------------------------------------
# Worker: generacion de PDFs de etiquetas de precio
# ------------------------------------------------------------
[program:laravel-pricelabels-exports-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /home/webadmin/web/artisan queue:work redis --queue=exports --sleep=3 --tries=3 --max-time=300 --timeout=300
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/laravel-pricelabels-exports-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
priority=999
