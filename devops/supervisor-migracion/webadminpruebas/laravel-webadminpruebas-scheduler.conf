# ============================================================
# Scheduler (schedule:work) — webadminpruebas
# ============================================================
# URGENTE: repone prueba-laravel-scheduler.conf, borrado por accidente
# junto con el resto de /etc/supervisor/conf.d/ durante la migracion del
# 18-sep-2026. Sin esto no corre ninguna tarea programada de este entorno.
#
# Copiar tal cual a la carpeta de configuracion de Supervisor, releer,
# aplicar, y arrancar laravel-webadminpruebas-scheduler.
# ============================================================

[program:laravel-webadminpruebas-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /home/webadminpruebas/web/artisan schedule:work
directory=/home/webadminpruebas/web
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadminpruebas/web/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
stopsignal=TERM
priority=15
