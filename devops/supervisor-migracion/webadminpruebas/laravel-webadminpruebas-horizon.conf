# ============================================================
# Horizon — webadminpruebas
# ============================================================
# Copiar tal cual a la carpeta de configuracion de Supervisor (REEMPLAZA
# al "laravel-horizon.conf" existente, que ya apuntaba bien a este mismo
# proyecto pero con el nombre viejo/generico -- se renombra para que haga
# juego con el resto de esta migracion: laravel-webadmin-horizon en
# produccion, laravel-webadminpruebas-horizon aca).
#
# Mismo proyecto, mismo config/horizon.php (ya actualizado con las 9 colas
# nuevas de Supplier/ERP/Helpdesk-ERP/Helpdesk-Compliance/Campanas) --
# esto NO es una correccion de destino como los demas archivos de esta
# carpeta, es solo el cambio de nombre para dejar de usar el genero viejo.
# ============================================================

[program:laravel-webadminpruebas-horizon]
process_name=%(program_name)s
command=/usr/bin/php /home/webadminpruebas/web/artisan horizon
directory=/home/webadminpruebas/web
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadminpruebas/web/storage/logs/laravel-horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
user=www-data
startsecs=10
; Horizon necesita apagarse limpio: termina el master, que espera a que
; los workers en curso acaben (o hasta el timeout) antes de salir.
stopwaitsecs=60
stopsignal=TERM
priority=15
