# ============================================================
# Reverb (WebSocket) — webadminpruebas
# ============================================================
# Copiar tal cual a /etc/supervisor/conf.d/ (REEMPLAZA a
# prueba-laravel-reverb.conf, mismo puerto 8080, nombre de programa
# distinto -- ver abajo). Activar con:
#
#   sudo supervisorctl stop prueba-laravel-reverb
#   sudo rm /etc/supervisor/conf.d/prueba-laravel-reverb.conf
#   sudo cp devops/supervisor-migracion/webadminpruebas/laravel-webadminpruebas-reverb.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start laravel-webadminpruebas-reverb
# ============================================================
# Mismo hallazgo que en produccion (ver LEEME.txt de esta carpeta,
# seccion webadmin): el navegador nunca puede abrir wss:// contra un
# puerto publico donde nadie termina TLS (ni Apache -- no tiene
# VirtualHost en :8080 -- ni Reverb, que trae 'tls' => [] fijo en
# config/reverb.php pese a que el .env de este proyecto define
# REVERB_LOCAL_CERT/REVERB_LOCAL_PK -- esas dos variables no estan
# cableadas a nada, confirmado con diff contra el config/reverb.php de
# produccion: son identicos).
#
# El vhost de webadminpruebas.a-alvarez.com YA tiene, bajo su bloque
# :443, el proxy correcto:
#
#   ProxyPass "/app" "ws://127.0.0.1:8080/app"
#   ProxyPassReverse "/app" "ws://127.0.0.1:8080/app"
#
# Por eso: bind en 127.0.0.1 (no 0.0.0.0 como el proceso actual -- el
# unico consumidor real es el Apache de esta misma maquina). El .env de
# este proyecto YA se corrigio (REVERB_HOST=webadminpruebas.a-alvarez.com,
# REVERB_PORT=443, REVERB_SERVER_HOST=127.0.0.1, REVERB_SERVER_PORT=8080
# -- antes apuntaba, los cuatro, a webadmin.a-alvarez.com:8081, el
# dominio y puerto de OTRO proyecto) y ya se corrio "npm run build" --
# verificado en el bundle nuevo: wssPort:443, wsHost:"webadminpruebas.a-alvarez.com".
# ============================================================

[program:laravel-webadminpruebas-reverb]
process_name=%(program_name)s
command=/usr/bin/php /home/webadminpruebas/web/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/webadminpruebas/web
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadminpruebas/web/storage/logs/reverb.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
stopsignal=TERM
priority=15
