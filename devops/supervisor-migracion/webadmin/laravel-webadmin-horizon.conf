# ============================================================
# Horizon dedicado a este proyecto (webadmin, /home/webadmin/web)
# ============================================================
# Copiar tal cual a /etc/supervisor/conf.d/ (mismo nombre de archivo).
# Activar con:
#   supervisorctl reread
#   supervisorctl update
#   supervisorctl start laravel-webadmin-horizon
# ============================================================
# Nombre de programa distinto a "laravel-horizon" (que ya existe y sirve a
# /home/webadminpruebas/web) a proposito: ambos coexisten, cada uno con su
# propio config/horizon.php (archivos separados, no symlink) y su propio
# REDIS_DB (webadminpruebas=0, este proyecto=1 -- ver comentario en
# laravel-queue-helpdesk.conf sobre por que se aislo). No se tocan entre si.
#
# Antes de instalar, correr en PARALELO con los workers sueltos existentes
# (Alsernet-supplier-*, laravel-queue-default/emails/erp/helpdesk,
# laravel-pricelabels-exports-worker) el tiempo suficiente para verificar en
# el dashboard de Horizon (/horizon) que cada supervisor-* de
# config/horizon.php esta realmente sacando jobs de su cola. Recien despues
# de confirmar eso, retirar (supervisorctl stop + borrar el .conf) los
# workers sueltos que Horizon ya cubre — uno por uno, no todos de una.
#
# laravel-health-worker y los dos laravel-document-*-worker NO se tocan
# nunca: corren con conexion `database`, que Horizon no puede gestionar
# (es Redis-only).
# ============================================================

[program:laravel-webadmin-horizon]
process_name=%(program_name)s
command=/usr/bin/php /home/webadmin/web/artisan horizon
directory=/home/webadmin/web
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
user=www-data
startsecs=10
; Horizon necesita apagarse limpio: termina el master, que espera a que
; los workers en curso acaben (o hasta el timeout) antes de salir.
stopwaitsecs=60
stopsignal=TERM
priority=15
