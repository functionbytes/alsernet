# ============================================================
# Scheduler (schedule:work) — webadmin
# ============================================================
# URGENTE: repone laravel-scheduler.conf, borrado por accidente junto con
# el resto de /etc/supervisor/conf.d/ durante la migracion del 18-sep-2026
# (un "systemctl restart supervisor" con los .conf viejos ya borrados se
# llevo puesto todo lo que no tenia archivo nuevo todavia). Sin esto no
# corre NINGUNA tarea programada de la app: backups, chequeos de SLA,
# campanas de cumpleanos, limpieza de logs, etc.
#
# Copiar tal cual a la carpeta de configuracion de Supervisor, releer,
# aplicar, y arrancar laravel-webadmin-scheduler.
# ============================================================

[program:laravel-webadmin-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /home/webadmin/web/artisan schedule:work
directory=/home/webadmin/web
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/home/webadmin/web/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
environment=LARAVEL_ENV=production
user=www-data
startsecs=10
stopwaitsecs=10
stopsignal=TERM
priority=15
