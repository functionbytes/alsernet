<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ModernAndClean theme</title>
<link rel="stylesheet" href="./theme.css">
</head>
<body>
<!--
    ModernAndClean — Dropbox-inspired theme ported from the approved Acelle
    static sample (resources/views/refactor/pages/sample/filebrowser.blade.php).
    Requires Material Symbols: consumers either include the font themselves
    or theme.css imports it via Google Fonts.
-->

<template data-fb-tpl="grid-card">
    <div class="fm-card fm-card-file" data-fb-attr="data-id:id;data-kind:kind" tabindex="0" role="button">
        <div class="fm-thumb" data-fb-class="fm-thumb--{kind}">
            <div class="fm-card-overlay">
                <button type="button" class="fm-star" data-fb-class-if="meta.starred:is-starred" onclick="event.stopPropagation();">
                    <span class="material-symbols-rounded">star</span>
                </button>
                <span class="fm-badges">
                    <span class="fm-badge-public" data-fb-if="isPublic" title="Public">
                        <span class="material-symbols-rounded">public</span>
                    </span>
                </span>
            </div>
            <img class="fm-thumb-image" data-fb-if="url" data-fb-attr="src:url;alt:name">
            <div class="fm-thumb-content" data-fb-if-not="url">
                <span class="fm-thumb-icon material-symbols-rounded" data-fb-text="kind|icon"></span>
            </div>
        </div>
        <div class="fm-card-body">
            <div class="fm-card-body-main">
                <div class="fm-card-name" data-fb-text="name"></div>
                <div class="fm-card-meta">
                    <span data-fb-text="size|bytes"></span>
                    <span class="fm-card-meta-sep"></span>
                    <span data-fb-text="modifiedAt|ago"></span>
                </div>
            </div>
            <button type="button" class="fm-btn fm-btn-ghost fm-btn-icon fm-card-kebab" title="More" onclick="event.stopPropagation();">
                <span class="material-symbols-rounded">more_vert</span>
            </button>
        </div>
    </div>
</template>

<template data-fb-tpl="folder-card">
    <div class="fm-folder-card" data-fb-attr="data-id:id" tabindex="0" role="button">
        <div class="fm-folder-icon">
            <span class="material-symbols-rounded">folder</span>
        </div>
        <div class="fm-folder-body">
            <div class="fm-folder-name" data-fb-text="name"></div>
            <div class="fm-folder-meta">
                <span><span data-fb-text="meta.childCount"></span> items</span>
                <span class="fm-folder-meta-sep" data-fb-if="meta.shared">·</span>
                <span class="fm-folder-meta-shared" data-fb-if="meta.shared">
                    <span class="material-symbols-rounded">group</span> Shared
                </span>
            </div>
        </div>
        <button type="button" class="fm-btn fm-btn-ghost fm-btn-icon fm-folder-kebab" title="More" onclick="event.stopPropagation();">
            <span class="material-symbols-rounded">more_vert</span>
        </button>
    </div>
</template>

<template data-fb-tpl="list-row">
    <div class="fm-row" data-fb-attr="data-id:id" tabindex="0">
        <div class="fm-row-thumb" data-fb-class="fm-thumb--{kind}">
            <span class="material-symbols-rounded" data-fb-text="kind|icon"></span>
        </div>
        <div class="fm-row-name" data-fb-text="name"></div>
        <div class="fm-row-kind" data-fb-text="kind"></div>
        <div class="fm-row-size" data-fb-text="size|bytes"></div>
        <div class="fm-row-modified" data-fb-text="modifiedAt|ago"></div>
        <button type="button" class="fm-btn fm-btn-ghost fm-btn-icon fm-row-kebab" title="More" onclick="event.stopPropagation();">
            <span class="material-symbols-rounded">more_horiz</span>
        </button>
    </div>
</template>

<template data-fb-tpl="breadcrumb-item">
    <span class="fm-crumb-slot" data-fb-class-if="isCurrent:fm-crumb-is-current">
        <a class="fm-crumb" data-fb-attr="href:path;data-path:path" data-fb-text="label"></a>
        <span class="fm-crumb-sep" data-fb-if-not="isCurrent">
            <span class="material-symbols-rounded">chevron_right</span>
        </span>
    </span>
</template>

<template data-fb-tpl="upload-progress-row">
    <div class="fm-upload-row">
        <div class="fm-upload-icon">
            <span class="material-symbols-rounded">upload_file</span>
        </div>
        <div class="fm-upload-body">
            <div class="fm-upload-name" data-fb-text="filename"></div>
            <div class="fm-upload-meta">
                <span data-fb-progress-status>queued</span>
                <span>·</span>
                <span data-fb-progress-pct>0%</span>
            </div>
            <div class="fm-upload-bar-wrap">
                <div class="fm-upload-bar" data-fb-progress-bar style="width: 0%;"></div>
            </div>
        </div>
    </div>
</template>

</body>
</html>
