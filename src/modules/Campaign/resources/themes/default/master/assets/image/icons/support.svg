<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Speech bubble with three dots, layered editorial icon">
  <rect width="96" height="96" fill="#F7F5F0"/>
  <ellipse cx="48" cy="78" rx="22" ry="3" fill="#C9C2B2" opacity="0.55"/>
  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
    <!-- back bubble (smaller, behind) -->
    <path d="M 24 24
             C 24 20, 28 16, 32 16
             L 60 16
             C 64 16, 68 20, 68 24
             L 68 38
             C 68 42, 64 46, 60 46
             L 50 46
             L 44 52
             L 44 46
             L 32 46
             C 28 46, 24 42, 24 38 Z"
          fill="#FEFDFA" stroke-width="1.6"/>
    <!-- front bubble (overlapping, larger) -->
    <path d="M 30 36
             C 30 30, 36 24, 44 24
             L 70 24
             C 78 24, 82 30, 82 36
             L 82 56
             C 82 62, 78 66, 70 66
             L 56 66
             L 48 76
             L 50 66
             L 44 66
             C 36 66, 30 62, 30 56 Z"
          fill="#FEFDFA" stroke-width="2"/>
    <!-- three dots inside front bubble -->
    <circle cx="48" cy="46" r="2.4" fill="#1C1917" stroke="none"/>
    <circle cx="58" cy="46" r="2.4" fill="#1C1917" stroke="none"/>
    <circle cx="68" cy="46" r="2.4" fill="#1C1917" stroke="none"/>
    <!-- subtle highlight on front bubble -->
    <path d="M 36 32 C 38 30, 42 30, 46 30" stroke="#C9C2B2" stroke-width="1.2" fill="none"/>
  </g>
</svg>
