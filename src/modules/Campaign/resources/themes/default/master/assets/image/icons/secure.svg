<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Shield with checkmark, layered editorial icon">
  <rect width="96" height="96" fill="#F7F5F0"/>
  <ellipse cx="48" cy="80" rx="22" ry="3" fill="#C9C2B2" opacity="0.55"/>
  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
    <!-- shield outline -->
    <path d="M 48 18
             C 60 22, 72 24, 76 26
             L 76 50
             C 76 64, 64 76, 48 80
             C 32 76, 20 64, 20 50
             L 20 26
             C 24 24, 36 22, 48 18 Z"
          fill="#FEFDFA" stroke-width="2"/>
    <!-- inner shield contour for depth -->
    <path d="M 48 24
             C 58 28, 68 30, 70 32
             L 70 50
             C 70 62, 60 70, 48 74
             C 36 70, 26 62, 26 50
             L 26 32
             C 28 30, 38 28, 48 24 Z"
          stroke="#C9C2B2" stroke-width="1" fill="none"/>
    <!-- checkmark -->
    <path d="M 36 50 L 44 58 L 60 40" stroke-width="2.6"/>
    <!-- highlight glint top-left -->
    <path d="M 30 30 C 32 30, 34 30, 36 31" stroke="#C9C2B2" stroke-width="1.2" fill="none"/>
  </g>
</svg>
