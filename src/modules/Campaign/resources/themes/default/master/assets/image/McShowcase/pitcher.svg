<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Ceramic pitcher line drawing">
  <rect width="400" height="500" fill="#F7F5F0"/>
  <g fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- pitcher body: bulbous, tapered neck, flared rim with spout -->
    <path d="M 150 160
             C 150 140, 160 128, 175 128
             L 220 128
             C 238 128, 248 140, 248 160
             L 258 172
             L 260 182
             C 282 192, 296 214, 296 244
             L 296 340
             C 296 372, 276 392, 246 392
             L 162 392
             C 132 392, 112 372, 112 340
             L 112 232
             C 112 202, 126 180, 148 170 Z" fill="#FEFDFA"/>
    <!-- spout shape -->
    <path d="M 248 160 L 258 172 L 260 182" fill="none"/>
    <!-- inner rim line -->
    <path d="M 175 138 C 198 140, 228 140, 240 138" stroke-width="1.4"/>
    <!-- handle: double curve from shoulder to mid body on right -->
    <path d="M 296 250
             C 336 248, 344 274, 338 308
             C 332 336, 316 352, 296 350"
          stroke-width="2.2"/>
    <path d="M 296 266
             C 322 266, 328 286, 322 308
             C 316 326, 306 334, 296 334"
          stroke-width="1.6"/>
    <!-- base ring -->
    <path d="M 120 392 C 170 400, 238 400, 288 392" stroke-width="1.4"/>
    <!-- shadow beneath -->
    <ellipse cx="204" cy="416" rx="120" ry="8" fill="#E5E1D8" stroke="none"/>
    <!-- floor line (thin) -->
    <line x1="80" y1="420" x2="330" y2="420" stroke="#D6D1C4" stroke-width="1"/>
    <!-- tiny highlight crescent for craft feel -->
    <path d="M 138 224 C 130 260, 130 306, 142 336" stroke="#C9C2B2" stroke-width="1" fill="none"/>
  </g>
</svg>
