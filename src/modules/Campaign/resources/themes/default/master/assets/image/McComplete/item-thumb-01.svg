<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Ceramic mug with handle, warm editorial line drawing">
  <rect width="400" height="400" fill="#F7F5F0"/>

  <!-- ambient floor shadow -->
  <ellipse cx="200" cy="340" rx="110" ry="6" fill="#C9C2B2" opacity="0.55"/>

  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">

    <!-- saucer (low profile) -->
    <ellipse cx="200" cy="326" rx="118" ry="14" fill="#FEFDFA" stroke-width="1.6"/>
    <ellipse cx="200" cy="320" rx="118" ry="14" stroke-width="1" fill="none"/>

    <!-- mug body: straight-sided cylinder -->
    <path d="M 138 142
             L 138 296
             C 138 310, 152 320, 172 320
             L 228 320
             C 248 320, 262 310, 262 296
             L 262 142 Z"
          fill="#FEFDFA" stroke-width="2"/>

    <!-- rim (top ellipse showing opening + ceramic thickness) -->
    <ellipse cx="200" cy="142" rx="62" ry="10" fill="#FEFDFA" stroke-width="2"/>
    <!-- coffee surface inside rim -->
    <ellipse cx="200" cy="144" rx="54" ry="7" fill="#C9C2B2" stroke="#1C1917" stroke-width="1"/>

    <!-- handle: rounded rectangular on right -->
    <path d="M 262 180
             C 304 180, 316 206, 316 234
             C 316 262, 300 282, 262 284"
          stroke-width="2.2"/>
    <!-- handle inner thickness -->
    <path d="M 264 198 C 296 200, 304 220, 304 234 C 304 250, 294 264, 264 266"
          stroke="#C9C2B2" stroke-width="1"/>

    <!-- left-side highlight crescent -->
    <path d="M 150 172 C 142 210, 142 258, 154 290" stroke="#C9C2B2" stroke-width="1"/>

    <!-- decoration: 2 horizontal pinstripes -->
    <line x1="146" y1="206" x2="254" y2="206" stroke="#C9C2B2" stroke-width="1"/>
    <line x1="146" y1="216" x2="254" y2="216" stroke="#C9C2B2" stroke-width="1"/>

    <!-- emblem triad (lower center front) -->
    <circle cx="194" cy="262" r="1.6" fill="#1C1917" stroke="none"/>
    <circle cx="200" cy="268" r="1.6" fill="#1C1917" stroke="none"/>
    <circle cx="206" cy="262" r="1.6" fill="#1C1917" stroke="none"/>

    <!-- gentle steam wisps -->
    <path d="M 180 130 C 176 110, 188 98, 182 80 C 178 68, 188 58, 184 46"
          stroke="#C9C2B2" stroke-width="1.6" opacity="0.9"/>
    <path d="M 216 130 C 212 112, 224 100, 218 82 C 214 68, 226 58, 222 46"
          stroke="#C9C2B2" stroke-width="1.6" opacity="0.9"/>

    <!-- floor line -->
    <line x1="60" y1="346" x2="340" y2="346" stroke="#C9C2B2" stroke-width="1"/>
  </g>
</svg>
