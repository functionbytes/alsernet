<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" role="img" aria-label="Complete radial burst logo">
  <g fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 8-ray radial burst centered at 100,28 -->
    <g transform="translate(100 28)">
      <line x1="0" y1="-22" x2="0" y2="-12" />
      <line x1="0" y1="22" x2="0" y2="12" />
      <line x1="-22" y1="0" x2="-12" y2="0" />
      <line x1="22" y1="0" x2="12" y2="0" />
      <line x1="-15.5" y1="-15.5" x2="-8.5" y2="-8.5" />
      <line x1="15.5" y1="15.5" x2="8.5" y2="8.5" />
      <line x1="15.5" y1="-15.5" x2="8.5" y2="-8.5" />
      <line x1="-15.5" y1="15.5" x2="-8.5" y2="8.5" />
      <circle cx="0" cy="0" r="6" fill="#111111" stroke="none" />
      <path d="M -3 0 L -0.8 2 L 3 -2" stroke="#FFFFFF" stroke-width="1.6" fill="none" />
    </g>
    <!-- dotted baseline flanking the burst -->
    <g stroke-width="1" stroke-dasharray="1 3">
      <line x1="12" y1="28" x2="70" y2="28" />
      <line x1="130" y1="28" x2="188" y2="28" />
    </g>
  </g>
</svg>
