<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Workspace logo">
  <!-- 4-petal aperture mark — rounded organic petals radiating from a tiny center.
       Distinct from Microsoft's flat 4-square; reads as "creative aperture / bloom". -->
  <g>
    <!-- Top: red petal -->
    <path d="M24 4 C30 8, 32 14, 28 22 C26 18, 22 18, 20 22 C16 14, 18 8, 24 4 Z" fill="#EA4335"/>
    <!-- Right: yellow petal -->
    <path d="M44 24 C40 30, 34 32, 26 28 C30 26, 30 22, 26 20 C34 16, 40 18, 44 24 Z" fill="#FBBC04"/>
    <!-- Bottom: green petal -->
    <path d="M24 44 C18 40, 16 34, 20 26 C22 30, 26 30, 28 26 C32 34, 30 40, 24 44 Z" fill="#34A853"/>
    <!-- Left: blue petal -->
    <path d="M4 24 C8 18, 14 16, 22 20 C18 22, 18 26, 22 28 C14 32, 8 30, 4 24 Z" fill="#1A73E8"/>
    <!-- Center dot -->
    <circle cx="24" cy="24" r="2.4" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#5F6368" letter-spacing="-0.2">Workspace</text>
</svg>
