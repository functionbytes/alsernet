<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Box with circular return arrow, layered editorial icon">
  <rect width="96" height="96" fill="#F7F5F0"/>
  <ellipse cx="48" cy="80" rx="24" ry="3" fill="#C9C2B2" opacity="0.55"/>
  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
    <!-- box body (slight perspective) -->
    <path d="M 28 44 L 28 76 L 68 76 L 68 44 Z" fill="#FEFDFA" stroke-width="1.8"/>
    <!-- box lid/top -->
    <path d="M 28 44 L 48 36 L 68 44" stroke-width="1.8" fill="#FEFDFA"/>
    <!-- box vertical seam -->
    <line x1="48" y1="36" x2="48" y2="76" stroke-width="1.2"/>
    <!-- circular return arrow -->
    <path d="M 22 30
             C 30 14, 56 14, 70 28"
          stroke-width="2"/>
    <!-- arrow head -->
    <path d="M 22 30 L 18 26" stroke-width="2"/>
    <path d="M 22 30 L 26 22" stroke-width="2"/>
    <!-- secondary arrow tail (smaller, lighter) -->
    <path d="M 70 28 C 76 32, 78 38, 76 42" stroke="#C9C2B2" stroke-width="1.2" fill="none"/>
    <!-- corner highlight on box -->
    <path d="M 30 46 L 32 46 L 32 48" stroke="#C9C2B2" stroke-width="1" fill="none"/>
  </g>
</svg>
