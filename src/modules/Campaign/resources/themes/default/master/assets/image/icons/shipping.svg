<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Wrapped parcel with twine, layered editorial icon">
  <rect width="96" height="96" fill="#F7F5F0"/>
  <ellipse cx="48" cy="78" rx="28" ry="3" fill="#C9C2B2" opacity="0.6"/>
  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
    <!-- box body -->
    <rect x="20" y="34" width="56" height="42" fill="#FEFDFA" stroke-width="1.8"/>
    <!-- box top edge -->
    <line x1="20" y1="34" x2="76" y2="34" stroke-width="1.8"/>
    <!-- vertical twine -->
    <line x1="48" y1="34" x2="48" y2="76" stroke-width="1.6"/>
    <!-- horizontal twine -->
    <line x1="20" y1="50" x2="76" y2="50" stroke-width="1.6"/>
    <!-- knot bow loops -->
    <ellipse cx="44" cy="48" rx="4" ry="2.4" stroke-width="1.2" transform="rotate(-20 44 48)"/>
    <ellipse cx="52" cy="48" rx="4" ry="2.4" stroke-width="1.2" transform="rotate(20 52 48)"/>
    <!-- knot center -->
    <circle cx="48" cy="50" r="1.6" fill="#1C1917" stroke="none"/>
    <!-- motion lines -->
    <line x1="6" y1="46" x2="14" y2="46" stroke-width="1.2" opacity="0.7"/>
    <line x1="6" y1="56" x2="12" y2="56" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="66" x2="14" y2="66" stroke-width="1.2" opacity="0.7"/>
    <!-- corner highlight -->
    <path d="M 22 36 L 24 36 L 24 38" stroke="#C9C2B2" stroke-width="1" fill="none"/>
  </g>
</svg>
