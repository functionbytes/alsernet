<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="LinkedIn Sponsored ad preview">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Post card -->
  <g transform="translate(14 18)">
    <rect x="0" y="0" width="152" height="164" rx="6"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke-bold)" stroke-width="1.2"/>

    <!-- Company row (square logo + name) -->
    <rect x="8" y="8" width="12" height="12" rx="1.5" fill="var(--illust-stroke-bold)"/>
    <rect x="10" y="11" width="8" height="6" rx=".5" fill="var(--color-card-bg)"/>
    <rect x="24" y="10" width="52" height="2.4" rx="1.2" fill="var(--illust-stroke-bold)"/>
    <rect x="24" y="14" width="36" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".7"/>
    <rect x="24" y="17.4" width="28" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".55"/>

    <!-- "Promoted" label -->
    <rect x="118" y="9" width="26" height="7" rx="1" fill="none" stroke="var(--illust-stroke)" stroke-width=".5"/>
    <rect x="122" y="11.5" width="18" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".75"/>

    <!-- Post body copy -->
    <rect x="8" y="26" width="136" height="1.8" rx=".9" fill="var(--illust-stroke-bold)"/>
    <rect x="8" y="30" width="120" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".7"/>
    <rect x="8" y="33.5" width="96"  height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".65"/>

    <!-- Hero image (1.91:1 with chart motif) -->
    <rect x="8" y="40" width="136" height="72" fill="var(--illust-fill)"
          stroke="var(--illust-stroke)" stroke-width=".5"/>

    <!-- Grid lines (data vibe) -->
    <g stroke="var(--illust-stroke)" stroke-width=".3" opacity=".35">
      <line x1="8"  y1="60" x2="144" y2="60"/>
      <line x1="8"  y1="80" x2="144" y2="80"/>
      <line x1="8"  y1="100" x2="144" y2="100"/>
      <line x1="30" y1="40" x2="30" y2="112"/>
      <line x1="60" y1="40" x2="60" y2="112"/>
      <line x1="90" y1="40" x2="90" y2="112"/>
      <line x1="120" y1="40" x2="120" y2="112"/>
    </g>

    <!-- Bar chart -->
    <rect x="18" y="96" width="8"  height="12" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="30" y="88" width="8"  height="20" fill="var(--illust-stroke)" opacity=".75"/>
    <rect x="42" y="80" width="8"  height="28" fill="var(--illust-stroke-bold)"/>
    <rect x="54" y="68" width="8"  height="40" fill="var(--illust-stroke-bold)"/>
    <rect x="66" y="58" width="8"  height="50" fill="var(--illust-stroke-bold)"/>

    <!-- Trend line -->
    <path d="M22 98 L34 92 L46 84 L58 74 L70 64"
          stroke="var(--illust-stroke-bold)" stroke-width="1.2"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Percentage callout -->
    <rect x="100" y="54" width="38" height="22" rx="2"
          fill="var(--color-card-bg)" stroke="var(--illust-stroke-bold)" stroke-width=".7"/>
    <rect x="104" y="58" width="30" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="104" y="62" width="24" height="5" rx=".6" fill="var(--illust-stroke-bold)"/>
    <rect x="104" y="70" width="26" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".65"/>

    <!-- CTA button + engagement row -->
    <rect x="8" y="120" width="48" height="12" rx="6" fill="var(--illust-stroke-bold)"/>
    <rect x="16" y="124" width="32" height="4" rx="1" fill="var(--color-card-bg)"/>

    <circle cx="66" cy="126" r="1.6" fill="var(--illust-stroke-bold)"/>
    <rect x="70" y="125" width="16" height="1.8" rx=".9" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="90" y="125" width="20" height="1.8" rx=".9" fill="var(--illust-stroke)" opacity=".55"/>
    <rect x="114" y="125" width="14" height="1.8" rx=".9" fill="var(--illust-stroke)" opacity=".55"/>

    <!-- Like bar -->
    <line x1="8" y1="140" x2="144" y2="140" stroke="var(--illust-stroke)" stroke-width=".4" opacity=".45"/>
    <rect x="8"  y="146" width="38" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="52" y="146" width="32" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".55"/>
    <rect x="90" y="146" width="28" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".55"/>
  </g>

  <!-- Aspect label -->
  <rect x="132" y="188" width="34" height="10" rx="5" fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)" stroke-width=".7"/>
  <text x="149" y="195" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="6" font-weight="700" fill="var(--illust-stroke-bold)" letter-spacing=".4">1.91:1</text>
</svg>
