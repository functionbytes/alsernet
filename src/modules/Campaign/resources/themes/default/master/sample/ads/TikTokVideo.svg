<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="TikTok Video ad preview">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Phone silhouette (9:16 centered) -->
  <g transform="translate(60 16)">
    <rect x="0" y="0" width="60" height="168" rx="8"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke-bold)" stroke-width="1.4"/>
    <rect x="22" y="3" width="16" height="2.4" rx="1.2" fill="var(--illust-stroke-bold)"/>

    <!-- Video screen -->
    <rect x="3" y="9" width="54" height="150" rx="4"
          fill="var(--illust-fill)"
          stroke="var(--illust-stroke)" stroke-width=".5"/>

    <!-- Creator silhouette (circle head + body) -->
    <circle cx="22" cy="52" r="7" fill="var(--illust-stroke)" opacity=".35"/>
    <rect x="14" y="60" width="16" height="18" rx="6" fill="var(--illust-stroke)" opacity=".35"/>

    <!-- Play button overlay -->
    <circle cx="30" cy="68" r="9" fill="var(--color-card-bg)" opacity=".85"/>
    <circle cx="30" cy="68" r="9" fill="none" stroke="var(--illust-stroke-bold)" stroke-width=".8"/>
    <path d="M27 63 L35 68 L27 73 Z" fill="var(--illust-stroke-bold)"/>

    <!-- Right-side action rail (profile, heart, comment, share, music) -->
    <circle cx="50" cy="52" r="3" fill="none" stroke="var(--illust-stroke-bold)" stroke-width=".8"/>
    <path d="M47 52 L49 54 L53 50" stroke="var(--illust-stroke-bold)" stroke-width=".8" fill="none" stroke-linecap="round"/>

    <path d="M50 66 C48 64 46 65 46 67 C46 69 50 72 50 72 C50 72 54 69 54 67 C54 65 52 64 50 66 Z"
          fill="none" stroke="var(--illust-stroke-bold)" stroke-width=".8"/>
    <rect x="47" y="74" width="6" height="1.4" rx=".7" fill="var(--illust-stroke-bold)"/>

    <path d="M47 82 L53 82 L53 86 L51 86 L50 87.6 L50 86 L47 86 Z"
          fill="none" stroke="var(--illust-stroke-bold)" stroke-width=".8"/>
    <rect x="47" y="90" width="6" height="1.4" rx=".7" fill="var(--illust-stroke-bold)"/>

    <path d="M46 97 L54 97 M54 97 L51 94 M54 97 L51 100"
          stroke="var(--illust-stroke-bold)" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Music disc -->
    <circle cx="50" cy="110" r="3" fill="none" stroke="var(--illust-stroke-bold)" stroke-width=".8"/>
    <circle cx="50" cy="110" r=".8" fill="var(--illust-stroke-bold)"/>

    <!-- Caption area (bottom) -->
    <rect x="6"  y="122" width="22" height="1.6" rx=".8" fill="var(--illust-stroke-bold)"/>
    <rect x="6"  y="125.5" width="14" height="1.2" rx=".6" fill="var(--illust-stroke)" opacity=".6"/>
    <rect x="6"  y="131" width="34" height="1.6" rx=".8" fill="var(--illust-stroke-bold)"/>
    <rect x="6"  y="134.5" width="28" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".7"/>

    <!-- Hashtag -->
    <rect x="6"  y="140" width="14" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".6"/>
    <rect x="22" y="140" width="10" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".55"/>

    <!-- Download CTA ribbon -->
    <rect x="6"  y="146" width="36" height="8" rx="1.5" fill="var(--illust-stroke-bold)"/>
    <rect x="12" y="149" width="24" height="2.2" rx="1" fill="var(--color-card-bg)"/>
  </g>

  <!-- Aspect label -->
  <rect x="138" y="12" width="28" height="10" rx="5" fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)" stroke-width=".7"/>
  <text x="152" y="19" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="6" font-weight="700" fill="var(--illust-stroke-bold)" letter-spacing=".4">9:16</text>
</svg>
