<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Facebook Feed ad preview">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Post card -->
  <g transform="translate(14 18)">
    <rect x="0" y="0" width="152" height="164" rx="6"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke-bold)" stroke-width="1.2"/>

    <!-- Brand row -->
    <circle cx="14" cy="14" r="5" fill="var(--illust-fill)" stroke="var(--illust-stroke-bold)" stroke-width=".7"/>
    <rect x="22" y="10" width="50" height="2.4" rx="1.2" fill="var(--illust-stroke-bold)"/>
    <rect x="22" y="15" width="32" height="1.8" rx=".9" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="22" y="18.5" width="22" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".5"/>

    <!-- Post text -->
    <rect x="10" y="28" width="132" height="1.8" rx=".9" fill="var(--illust-stroke-bold)"/>
    <rect x="10" y="32" width="116" height="1.8" rx=".9" fill="var(--illust-stroke)" opacity=".75"/>

    <!-- Hero image (1.91:1 landscape inside post) -->
    <rect x="10" y="40" width="132" height="70" fill="var(--illust-fill)"
          stroke="var(--illust-stroke)" stroke-width=".5"/>
    <path d="M10 98 L34 76 L50 86 L72 64 L94 84 L116 72 L142 88 L142 110 L10 110 Z"
          fill="var(--illust-stroke)" opacity=".55"/>
    <circle cx="118" cy="56" r="4" fill="var(--color-card-bg)" stroke="var(--illust-stroke)" stroke-width=".6"/>

    <!-- Link card footer (fb style) -->
    <rect x="10" y="114" width="132" height="22" fill="var(--illust-bg)" stroke="var(--illust-stroke)" stroke-width=".4"/>
    <rect x="14" y="118" width="28" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="14" y="122" width="94" height="2"   rx="1"  fill="var(--illust-stroke-bold)"/>
    <rect x="14" y="126" width="76" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".75"/>
    <rect x="14" y="130" width="50" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".5"/>
    <!-- CTA chip -->
    <rect x="112" y="119" width="26" height="12" rx="1.5" fill="var(--illust-stroke-bold)"/>
    <rect x="116" y="123" width="18" height="3" rx="1" fill="var(--color-card-bg)"/>

    <!-- Reactions row -->
    <circle cx="14" cy="148" r="1.6" fill="var(--illust-stroke-bold)"/>
    <rect x="18" y="147" width="18" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".65"/>
    <rect x="42" y="147" width="22" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".5"/>
    <rect x="70" y="147" width="14" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".5"/>
  </g>

  <!-- Aspect label -->
  <rect x="132" y="188" width="34" height="10" rx="5" fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)" stroke-width=".7"/>
  <text x="149" y="195" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="6" font-weight="700" fill="var(--illust-stroke-bold)" letter-spacing=".4">1.91:1</text>
</svg>
