<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Google Responsive Display ad preview">
  <rect width="180" height="200" fill="var(--illust-bg)"/>

  <!-- Browser frame -->
  <g transform="translate(10 22)">
    <rect x="0" y="0" width="160" height="160" rx="6"
          fill="var(--color-card-bg)"
          stroke="var(--illust-stroke-bold)" stroke-width="1.2"/>

    <!-- Browser chrome (dots + URL) -->
    <circle cx="8"  cy="7" r="1.4" fill="var(--illust-stroke)" opacity=".7"/>
    <circle cx="13" cy="7" r="1.4" fill="var(--illust-stroke)" opacity=".7"/>
    <circle cx="18" cy="7" r="1.4" fill="var(--illust-stroke)" opacity=".7"/>
    <rect x="24" y="4"  width="120" height="6" rx="3" fill="var(--illust-bg)" stroke="var(--illust-stroke)" stroke-width=".4"/>
    <rect x="28" y="6.4" width="48"  height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".65"/>
    <line x1="0" y1="14" x2="160" y2="14" stroke="var(--illust-stroke)" stroke-width=".4" opacity=".6"/>

    <!-- Ad container -->
    <g transform="translate(10 24)">
      <rect x="0" y="0" width="140" height="124" rx="2"
            fill="var(--illust-bg)" stroke="var(--illust-stroke)" stroke-width=".5"/>

      <!-- "Ad" label -->
      <rect x="4" y="4" width="14" height="6" rx="1" fill="none" stroke="var(--illust-stroke)" stroke-width=".5"/>
      <text x="11" y="8.5" text-anchor="middle" font-family="system-ui, sans-serif"
            font-size="4" font-weight="700" fill="var(--illust-stroke-bold)">AD</text>

      <!-- Logo (4-color dots reduced to 4 neutral circles) -->
      <circle cx="24" cy="7" r="1.6" fill="var(--illust-stroke-bold)"/>
      <circle cx="29" cy="7" r="1.6" fill="var(--illust-stroke)" opacity=".7"/>
      <circle cx="34" cy="7" r="1.6" fill="var(--illust-stroke-bold)"/>
      <circle cx="39" cy="7" r="1.6" fill="var(--illust-stroke)" opacity=".5"/>

      <!-- Headline 1 (primary, highlighted) -->
      <rect x="4"  y="16" width="84" height="2"  rx="1" fill="var(--illust-stroke-bold)"/>
      <rect x="4"  y="20" width="68" height="2"  rx="1" fill="var(--illust-stroke-bold)"/>

      <!-- Headline 2 -->
      <rect x="4"  y="26" width="74" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".7"/>
      <rect x="4"  y="30" width="58" height="1.6" rx=".8" fill="var(--illust-stroke)" opacity=".7"/>

      <!-- Description -->
      <rect x="4"  y="38" width="88" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".55"/>
      <rect x="4"  y="42" width="76" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".55"/>

      <!-- Image slot -->
      <rect x="96" y="16" width="42" height="42" fill="var(--illust-fill)"
            stroke="var(--illust-stroke)" stroke-width=".5"/>
      <path d="M96 50 L104 42 L110 46 L118 38 L126 46 L134 42 L138 46 L138 58 L96 58 Z"
            fill="var(--illust-stroke)" opacity=".5"/>
      <circle cx="128" cy="24" r="2" fill="var(--color-card-bg)" stroke="var(--illust-stroke)" stroke-width=".5"/>

      <!-- URL line -->
      <rect x="4"  y="62" width="50" height="1.4" rx=".7" fill="var(--illust-stroke)" opacity=".5"/>

      <!-- CTA button (black) -->
      <rect x="4"  y="70" width="36" height="12" rx="1.5" fill="var(--illust-stroke-bold)"/>
      <rect x="10" y="74" width="24" height="4"  rx="1"   fill="var(--color-card-bg)"/>

      <!-- Site nav hint (3 more ad positions) -->
      <rect x="4"   y="92"  width="132" height="24" fill="var(--illust-fill)" opacity=".6"/>
      <rect x="8"   y="96"  width="38"  height="16" fill="var(--illust-bg)" stroke="var(--illust-stroke)" stroke-width=".4"/>
      <rect x="50"  y="96"  width="38"  height="16" fill="var(--illust-bg)" stroke="var(--illust-stroke)" stroke-width=".4"/>
      <rect x="92"  y="96"  width="38"  height="16" fill="var(--illust-bg)" stroke="var(--illust-stroke)" stroke-width=".4"/>
    </g>
  </g>

  <!-- Aspect label -->
  <rect x="132" y="188" width="34" height="10" rx="5" fill="var(--color-card-bg)"
        stroke="var(--illust-stroke)" stroke-width=".7"/>
  <text x="149" y="195" text-anchor="middle" font-family="system-ui, sans-serif"
        font-size="6" font-weight="700" fill="var(--illust-stroke-bold)" letter-spacing=".4">1.91:1</text>
</svg>
