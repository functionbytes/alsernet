<div class="bjs-checkout-control bjs-control-stack">
    <!-- UI Settings -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">UI Settings</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Preview Label</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.ui.previewLabel %>"
                   data-path="ui.previewLabel">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Mode Label</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.ui.modeLabel %>"
                   data-path="ui.modeLabel">
        </label>
    </section>

    <!-- Header -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Header</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Header Title</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headerTitle %>"
                   data-path="headerTitle">
        </label>
    </section>

    <!-- Button Texts -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Button Texts</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Guest Submit Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.buttonTexts.guestSubmit %>"
                   data-path="buttonTexts.guestSubmit">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Saved Button Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.buttonTexts.saved %>"
                   data-path="buttonTexts.saved">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Upgrade/Downgrade Button Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.buttonTexts.upgrade %>"
                   data-path="buttonTexts.upgrade">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Submitting Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.buttonTexts.submitting %>"
                   data-path="buttonTexts.submitting">
        </label>
    </section>

    <!-- Section Headlines -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Section Headlines</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Contact Information Headline</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headlines.contact %>"
                   data-path="headlines.contact">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Billing Information Headline</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headlines.billing %>"
                   data-path="headlines.billing">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Payment Information Headline</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headlines.payment %>"
                   data-path="headlines.payment">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Privacy Notice</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.headlines.privacy %>"
                   data-path="headlines.privacy">
        </label>
    </section>

    <!-- Contact Input Labels -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Contact Input Labels</div>

        <div class="bjs-checkout-grid-2">
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">First Name</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.firstName %>"
                       data-path="contactLabels.firstName">
            </label>
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">Last Name</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.lastName %>"
                       data-path="contactLabels.lastName">
            </label>
        </div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Email</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.email %>"
                   data-path="contactLabels.email">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Phone Number</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.phone %>"
                   data-path="contactLabels.phone">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Address</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.address %>"
                   data-path="contactLabels.address">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Apartment/Building</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.apartment %>"
                   data-path="contactLabels.apartment">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Optional Text</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.contactLabels.apartmentOptional %>"
                   data-path="contactLabels.apartmentOptional">
        </label>

        <div class="bjs-checkout-grid-2">
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">Country</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.country %>"
                       data-path="contactLabels.country">
            </label>
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">State</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.state %>"
                       data-path="contactLabels.state">
            </label>
        </div>

        <div class="bjs-checkout-grid-2">
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">City</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.city %>"
                       data-path="contactLabels.city">
            </label>
            <label class="bjs-checkout-field">
                <span class="bjs-checkout-field-label">Postal Code</span>
                <input type="text" class="bjs-text-input"
                       value="<%= values.contactLabels.postal %>"
                       data-path="contactLabels.postal">
            </label>
        </div>
    </section>

    <!-- Default Values -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Default Values</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Default Country</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.defaults.country %>"
                   data-path="defaults.country">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Default State</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.defaults.state %>"
                   data-path="defaults.state">
        </label>
    </section>

    <!-- Payment Summary -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Payment Summary</div>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Summary Title</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.paymentSummary.title %>"
                   data-path="paymentSummary.title">
        </label>

        <label class="bjs-checkout-field">
            <span class="bjs-checkout-field-label">Summary CTA</span>
            <input type="text" class="bjs-text-input"
                   value="<%= values.paymentSummary.cta %>"
                   data-path="paymentSummary.cta">
        </label>
    </section>

    <!-- Colors -->
    <section class="bjs-checkout-section">
        <div class="bjs-checkout-section-title">Colors</div>

        <div class="bjs-checkout-color-row">
            <span class="bjs-checkout-field-label">Text Color</span>
            <label class="bjs-checkout-color-chip" style="--bjs-color-current: <%= values.colors && values.colors.text ? values.colors.text : '#ffffff' %>">
                <input type="color" class="bjs-checkout-color-native"
                       value="<%= values.colors && values.colors.text ? values.colors.text : '#ffffff' %>"
                       data-path="colors.text">
                <span class="bjs-checkout-color-preview"></span>
            </label>
        </div>

        <div class="bjs-checkout-color-row">
            <span class="bjs-checkout-field-label">Link Color</span>
            <label class="bjs-checkout-color-chip" style="--bjs-color-current: <%= values.colors && values.colors.link ? values.colors.link : '#ffffff' %>">
                <input type="color" class="bjs-checkout-color-native"
                       value="<%= values.colors && values.colors.link ? values.colors.link : '#ffffff' %>"
                       data-path="colors.link">
                <span class="bjs-checkout-color-preview"></span>
            </label>
        </div>
    </section>
</div>
