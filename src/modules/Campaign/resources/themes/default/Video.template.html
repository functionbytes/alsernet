<div style="display: flex; align-items: center; justify-content: <%- formatter.getFormat('align', 'center') %>;">
    <% if (!src) { %>
        <%
            // Apply the same width/height the real <video> would use, so the
            // user can visualize how large the video placeholder will render
            // while they tweak the sliders. Fall back to `auto` when unset so
            // the empty state stays compact on first drop.
            var placeholderStyle = formatter.toStyleStringAll([
                'width','height',
                'border_top_style','border_top_width','border_top_color',
                'border_right_style','border_right_width','border_right_color',
                'border_bottom_style','border_bottom_width','border_bottom_color',
                'border_left_style','border_left_width','border_left_color',
                'border_radius'
            ]);
        %>
        <div class="bjs-video-placeholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 2.25rem 1rem; text-align: center; box-sizing: border-box; max-width: 100%; min-width: 240px; min-height: 180px; <%- placeholderStyle %> border: 1px dashed #c7ccd4; background: #f6f7f9; color: #5a6270;">
            <svg width="96" height="72" viewBox="0 0 96 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="flex: 0 0 auto;">
                <rect x="1" y="1" width="94" height="62" rx="6" fill="#ffffff" stroke="#c7ccd4" stroke-width="1.5"/>
                <path d="M40 22 L62 32 L40 42 Z" fill="#3b82f6" opacity="0.85"/>
                <line x1="10" y1="68" x2="86" y2="68" stroke="#c7ccd4" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <div>
                <h4 style="margin: 0 0 4px; font-weight: 600; font-size: 15px; color: #1f2937;" inline-edit="text">No video yet</h4>
                <p style="margin: 0; font-size: 13px; line-height: 1.5;" inline-edit="text">Paste a direct video URL (.mp4, .webm, .ogg) in the right panel to preview it here.</p>
            </div>
        </div>
    <% } else { %>
        <div style="position: relative; max-width: 100%;">
            <video
                style="display: block; max-width: 100%; <%- formatter.toStyleStringAll(['width','height','border_top_style','border_top_width','border_top_color','border_right_style','border_right_width','border_right_color','border_bottom_style','border_bottom_width','border_bottom_color','border_left_style','border_left_width','border_left_color','border_radius']) %> box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);"
                src="<%= src %>"
                autoplay="[[AUTOPLAY]]" loop="[[LOOP]]" muted="[[MUTED]]" playsinline="[[PLAYSINLINE]]" controls="[[CONTROLS]]"
                onerror="var e=this.nextElementSibling; if(e){e.hidden=false;} this.style.visibility='hidden';"
            >
                <source src="<%= src %>" type="video/mp4">
                <source src="[[SRC_OGG]]" type="video/ogg">
                <source src="[[SRC_WEBM]]" type="video/webm">
                Your browser does not support the video tag.
            </video>
            <div hidden style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; border: 1px dashed #e0b4b4; border-radius: 8px; background: #fff5f5; color: #b04343; font-size: 13px; line-height: 1.5;">
                <span>The video URL couldn't be played. The file may be missing, blocked by CORS, or not a supported format (mp4/webm/ogg).</span>
            </div>
        </div>
    <% } %>
</div>
