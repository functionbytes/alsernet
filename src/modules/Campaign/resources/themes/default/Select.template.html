<div style="width: 100%;">
    <select
        name="<%- inputName || 'select_field' %>"
        style="<%- formatter.toStyleStringAll() %>box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 12px; color: #0f172a; background-color: <%- formatter.getFormat('background_color', '#ffffff') %>; <% if (!formatter.getFormat('width')) { %>width: 100%;<% } %> <% if (!formatter.getFormat('height')) { %>min-height: 44px;<% } %>"
    >
        <% items.forEach(function(item, index) { %>
            <option value="<%- item.value %>" <%= index === 0 ? 'selected' : '' %>><%- item.label %></option>
        <% }); %>
    </select>
</div>
