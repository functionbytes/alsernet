                      period:
                        type: object
                        properties:
                          since:
                            type: string
                            format: date
                            example: "2026-03-01"
                          until:
                            type: string
                            format: date
                            example: "2026-04-01"
                      summary:
                        type: object
                        properties:
                          total_comments:
                            type: integer
                            example: 248
                          total_replies:
                            type: integer
                            example: 180
                          avg_response_time_min:
                            type: number
                            format: float
                            nullable: true
                            example: 15.5
                          auto_reply_rate:
                            type: number
                            format: float
                            example: 18.2
                      by_date:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            comments:
                              type: integer
                              example: 10
                            replies:
                              type: integer
                              example: 8
                            avg_response_time_min:
                              type: number
                              format: float
                              nullable: true
                              example: 12.3
                            escalations:
                              type: integer
                              example: 1
                            metrics_automation_rate:
                              type: number
                              format: float
                              nullable: true
                              example: 0.25
                      by_platform:
                        type: array
                        items:
                          type: object
                          properties:
                            count:
                              type: integer
                              example: 120
                            replies:
                              type: integer
                              example: 90
                            auto_replied:
                              type: integer
                              example: 30
                      by_intent:
                        type: array
                        items:
                          type: object
                          properties:
                            count:
                              type: integer
                              example: 80
