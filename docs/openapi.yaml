                  example: "page"
                external_id:
                  type: string
                  maxLength: 255
                  example: "123456789012345"
                username:
                  type: string
                  maxLength: 255
                  nullable: true
                  example: "alsernet"
                profile_url:
                  type: string
                  format: uri
                  maxLength: 500
                  nullable: true
                  example: "https://facebook.com/alsernet"
                page_access_token:
                  type: string
                  nullable: true
                user_access_token:
                  type: string
                  nullable: true
                comments_enabled:
                  type: boolean
                  example: true
                messages_enabled:
                  type: boolean
                  example: true
                auto_reply_enabled:
                  type: boolean
                  example: false
