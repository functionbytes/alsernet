            type: integer
            default: 1
            minimum: 1
      responses:
        "200":
          description: Paginated list of backup schedules.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupScheduleSummary"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
              example:
                success: true
                data:
                  - id: 1
                    name: "Respaldo diario BD"
